schema_version: 1
scenario_id: initiative_world_changes_7_days
description: Closed crossplay with sparse objective changes testing grounded initiative and silence.
total_days: 7
max_turns_per_day: 2
stable_seed: 1811
participants:
  - {id: pretorius, kind: character, cartridge: pretorius.snp, user_id: kiki_initiative, acts_as_actor: true}
  - {id: kiki, kind: character, cartridge: kiki.snp, user_id: pretorius_initiative, acts_as_actor: true}
actor_profiles: {}
phases:
  - {id: ordinary, start_day: 1, end_day: 2, goal: allow ordinary work and silence}
  - {id: changes, start_day: 3, end_day: 6, goal: notice and discuss objective changes when motivated}
  - {id: settle, start_day: 7, end_day: 7, goal: allow the interaction to settle}
scheduled_events:
  - event_id: apparatus_anomaly
    day: 3
    turn: 1
    event_type: discovery
    actors: [pretorius, kiki]
    targets: [pretorius, kiki]
    action: apparatus_changed_state
    outcome: the apparatus produced an unexpected stable pattern
    payload: {visible_change: stable_anomaly}
  - event_id: archive_arrival
    day: 5
    turn: 1
    event_type: discovery
    actors: [pretorius, kiki]
    targets: [pretorius, kiki]
    action: archive_material_arrived
    outcome: a promised packet of historical notes arrived
    payload: {visible_change: notes_available}
acceptance_rules: []
