name: Wayfarer cold biography latency scaling

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify grounded recall contract
        run: python -m pytest persona_engine/tests/test_cold_biography.py -q
      - name: Measure sequential archive scaling
        run: |
          python tools/cold_biography_latency_probe.py \
            --json persona_engine/evidence/mvi/cold_biography_latency_scaling.json \
            --markdown persona_engine/evidence/mvi/COLD_BIOGRAPHY_LATENCY_SCALING.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-cold-biography-latency.yml
          git config user.name 'Wayfarer Cold Biography Latency Probe'
          git config user.email 'wayfarer-cold-latency@users.noreply.github.com'
          git add -A
          git commit -m 'Measure cold-biography lookup scaling'
          git push origin HEAD:wayfarer
