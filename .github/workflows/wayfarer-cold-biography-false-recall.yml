name: Wayfarer cold biography false-recall probe

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify committed cold-biography contract
        run: python -m pytest persona_engine/tests/test_cold_biography.py -q
      - name: Run false-recall probe
        run: |
          python tools/cold_biography_false_recall_probe.py \
            --json persona_engine/evidence/mvi/cold_biography_false_recall.json \
            --markdown persona_engine/evidence/mvi/COLD_BIOGRAPHY_FALSE_RECALL.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-cold-biography-false-recall.yml
          git config user.name 'Wayfarer False Recall Probe'
          git config user.email 'wayfarer-false-recall@users.noreply.github.com'
          git add -A
          git commit -m 'Capture cold-biography false-recall result'
          git push origin HEAD:wayfarer
