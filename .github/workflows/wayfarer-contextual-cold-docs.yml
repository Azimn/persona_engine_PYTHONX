name: Wayfarer contextual cold docs

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update Wayfarer documentation
        run: python tools/_update_contextual_cold_docs.py
      - name: Commit synchronized documentation
        run: |
          rm -f tools/_update_contextual_cold_docs.py
          rm -f .github/workflows/wayfarer-contextual-cold-docs.yml
          git config user.name 'Wayfarer Contextual Cold Docs'
          git config user.email 'wayfarer-contextual-docs@users.noreply.github.com'
          git add -A
          git commit -m 'Document contextual cold-biography phase'
          git push origin HEAD:wayfarer
