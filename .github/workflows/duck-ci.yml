name: DUCK CI

on:
  push:
    branches: [duck-organism, 'duck-*']
  pull_request:
    branches: [duck-organism]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Gate expression delivery path
        if: startsWith(github.ref_name, 'duck-future')
        run: python -m pytest persona_engine/tests/test_duck_future_expression.py::test_user_message_becomes_selected_communication_and_delivery_receipt -q

      - name: Gate renderer-swap canonical invariance
        if: startsWith(github.ref_name, 'duck-future')
        run: python -m pytest persona_engine/tests/test_duck_future_expression.py::test_expression_model_swap_changes_surface_not_duck_canonical_state -q

      - name: Gate recorded expression replay
        if: startsWith(github.ref_name, 'duck-future')
        run: python -m pytest persona_engine/tests/test_duck_future_expression.py::test_recorded_expression_is_reused_without_recalling_renderer -q

      - name: Run full inherited deterministic suite
        run: python -m pytest persona_engine/tests -q

      - name: Run focused DUCK organism suite
        run: python -m pytest persona_engine/tests/test_duck_*.py -q

      - name: Verify DUCK smoke entry point
        run: python tools/run_duck_smoke.py --output /tmp/duck-smoke.json

      - name: Run DUCK future-build integration probe
        if: startsWith(github.ref_name, 'duck-future')
        run: python tools/run_duck_future_probe.py --cycles 200 --output /tmp/duck-future-probe.json
