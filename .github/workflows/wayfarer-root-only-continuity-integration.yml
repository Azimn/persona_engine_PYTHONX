name: Wayfarer root-only continuity integration

on:
  push:
    branches: [wayfarer]
    paths:
      - 'WAYFARER_ROOT_ONLY_CONTINUITY_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply root-only continuity policy
        run: |
          python tools/_integrate_root_only_continuity.py
          python tools/_fix_root_only_test_expectations.py
          python -m compileall -q persona_engine tools
      - name: Run focused continuity contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_root_only_continuity.py \
            persona_engine/tests/test_continuity_ledger.py \
            persona_engine/tests/test_continuity_replay.py \
            persona_engine/tests/test_cold_biography.py \
            persona_engine/tests/test_bounded_diagnostic_persistence.py \
            persona_engine/tests/test_dream_engine.py -q
      - name: Run full deterministic suite
        run: python -m pytest -q
      - name: Measure root-only production storage
        run: |
          python tools/persistence_storage_probe.py --turns 1000 \
            --json persona_engine/evidence/mvi/root_only_continuity_storage.json \
            --markdown persona_engine/evidence/mvi/ROOT_ONLY_CONTINUITY_STORAGE.md
      - name: Re-run 5000-turn production plateau
        run: |
          python tools/production_resident_plateau_probe.py \
            --json persona_engine/evidence/mvi/root_only_production_plateau.json \
            --markdown persona_engine/evidence/mvi/ROOT_ONLY_PRODUCTION_PLATEAU.md
      - name: Commit runtime policy and evidence
        run: |
          rm -f tools/_integrate_root_only_continuity.py
          rm -f tools/_fix_root_only_test_expectations.py
          rm -f .github/workflows/wayfarer-root-only-continuity-integration.yml
          rm -f WAYFARER_ROOT_ONLY_CONTINUITY_TRIGGER.txt
          git config user.name 'Wayfarer Root-Only Continuity'
          git config user.email 'wayfarer-root-only-continuity@users.noreply.github.com'
          git add -A
          git commit -m 'Persist minimum-sufficient causal continuity roots'
          git push origin HEAD:wayfarer
