name: Wayfarer minimal commitment constraint integration

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply minimal commitment integration
        run: python tools/apply_minimal_commitment_constraint.py
      - name: Run focused commitment and continuity tests
        run: |
          python -m pytest \
            persona_engine/tests/test_commitment_constraint.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_continuity_replay.py \
            persona_engine/tests/test_continuity_clock.py -q
      - name: Capture post-fix commitment evidence
        run: |
          python tools/commitment_constraint_probe.py \
            --json persona_engine/evidence/mvi/commitment_constraint.json \
            --markdown persona_engine/evidence/mvi/COMMITMENT_CONSTRAINT.md
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Commit integrated mechanism and evidence
        run: |
          rm -f tools/apply_minimal_commitment_constraint.py .github/workflows/wayfarer-commitment-integrate.yml
          git config user.name 'Wayfarer Commitment Integration'
          git config user.email 'wayfarer-commitment@users.noreply.github.com'
          git add -A
          git commit -m 'Let self-adopted commitments constrain later conduct'
          git push origin HEAD:wayfarer
