name: Wayfarer memory consumer role probe

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify current memory contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_cold_biography.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_offline_template_renderer.py -q
      - name: Run consumer-role and repair probe
        run: |
          python tools/memory_consumer_role_probe.py \
            --json persona_engine/evidence/mvi/memory_consumer_role.json \
            --markdown persona_engine/evidence/mvi/MEMORY_CONSUMER_ROLE.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-memory-consumer-role.yml
          git config user.name 'Wayfarer Memory Consumer Role Probe'
          git config user.email 'wayfarer-memory-role@users.noreply.github.com'
          git add -A
          git commit -m 'Capture memory consumer role evidence'
          git push origin HEAD:wayfarer
