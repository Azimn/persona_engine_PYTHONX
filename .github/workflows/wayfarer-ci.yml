name: Wayfarer CI

on:
  push:
    branches: [wayfarer, 'wayfarer-*']
  pull_request:
    branches: [main, wayfarer]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run deterministic test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest persona_engine/tests -q | tee .wayfarer-pytest-summary.txt

      - name: Check current-status documentation sync
        run: python tools/check_current_status_sync.py --pytest-output .wayfarer-pytest-summary.txt
