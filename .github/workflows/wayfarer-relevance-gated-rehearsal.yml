name: Wayfarer relevance-gated memory rehearsal

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run focused memory and continuity tests
        run: |
          python -m pytest \
            persona_engine/tests/test_memory_first_person_contract.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_cold_biography.py \
            persona_engine/tests/test_commitment_constraint.py -q
      - name: Regenerate rehearsal diagnostic
        run: |
          python tools/retrieval_rehearsal_probe.py \
            --json persona_engine/evidence/mvi/retrieval_rehearsal.json \
            --markdown persona_engine/evidence/mvi/RETRIEVAL_REHEARSAL.md
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('persona_engine/evidence/mvi/retrieval_rehearsal.json').read_text())
          assert result['returned_on_unrelated_turns'] == 100
          assert result['recall_timestamps_after_unrelated_turns'] == 0
          assert result['unrelated_rehearsal_demonstrated'] is False
          assert result['relevant_returned'] is True
          assert result['timestamps_after_relevant'] == 1
          PY
      - name: Regenerate bounded active-state growth evidence
        run: |
          python tools/active_state_growth_probe.py \
            --json persona_engine/evidence/mvi/active_state_growth.json \
            --markdown persona_engine/evidence/mvi/ACTIVE_STATE_GROWTH.md
      - name: Recheck continuous compact-history behavior
        run: |
          python tools/continuous_hot_memory_probe.py \
            --json persona_engine/evidence/mvi/continuous_hot_memory.json \
            --markdown persona_engine/evidence/mvi/CONTINUOUS_HOT_MEMORY.md
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Commit corrected evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-relevance-gated-rehearsal.yml
          git config user.name 'Wayfarer Rehearsal Validation'
          git config user.email 'wayfarer-rehearsal-validation@users.noreply.github.com'
          git add -A
          git commit -m 'Validate relevance-gated memory rehearsal'
          git push origin HEAD:wayfarer
