name: Wayfarer explicit subject-state scope

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply explicit subject-state scope
        run: python tools/apply_subject_state_scope.py
      - name: Run focused state-ownership tests
        run: |
          python -m pytest \
            persona_engine/tests/test_subject_state_scope.py \
            persona_engine/tests/test_continuity_clock.py \
            persona_engine/tests/test_subject_sequence.py \
            persona_engine/tests/test_interlocutor_subject_state.py \
            persona_engine/tests/test_commitment_constraint.py -q
      - name: Regenerate ownership evidence
        run: |
          python tools/subject_trait_ownership_probe.py \
            --json persona_engine/evidence/mvi/subject_trait_ownership.json \
            --markdown persona_engine/evidence/mvi/SUBJECT_TRAIT_OWNERSHIP.md
          python tools/subject_clock_ownership_probe.py \
            --json persona_engine/evidence/mvi/subject_clock_ownership.json \
            --markdown persona_engine/evidence/mvi/SUBJECT_CLOCK_OWNERSHIP.md
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Commit integrated scope and evidence
        run: |
          rm -f tools/apply_subject_state_scope.py .github/workflows/wayfarer-subject-state-scope.yml
          git config user.name 'Wayfarer Subject State Integration'
          git config user.email 'wayfarer-subject-state@users.noreply.github.com'
          git add -A
          git commit -m 'Make demonstrated character state explicitly subject-owned'
          git push origin HEAD:wayfarer
