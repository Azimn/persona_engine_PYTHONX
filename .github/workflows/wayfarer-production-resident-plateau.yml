name: Wayfarer production resident-state plateau

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  plateau:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify production residency contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_role_bounded_user_memory.py \
            persona_engine/tests/test_memory_experience_guards.py \
            persona_engine/tests/test_cold_biography.py \
            persona_engine/tests/test_history_decision_evidence.py -q
      - name: Run 5000-turn production plateau
        run: |
          python tools/production_resident_plateau_probe.py \
            --json persona_engine/evidence/mvi/production_resident_plateau.json \
            --markdown persona_engine/evidence/mvi/PRODUCTION_RESIDENT_PLATEAU.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-production-resident-plateau.yml
          git config user.name 'Wayfarer Production Plateau'
          git config user.email 'wayfarer-production-plateau@users.noreply.github.com'
          git add -A
          git commit -m 'Measure production resident-state plateau'
          git push origin HEAD:wayfarer
