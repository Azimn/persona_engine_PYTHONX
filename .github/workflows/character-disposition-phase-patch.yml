name: Character Disposition Phase Structural Patch

on:
  push:
    branches: [wayfarer-character-dispositions-phase]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrow structural patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "persona_engine/core/cartridge.py",
              "from .identity import CoreIdentity, IdentityLedger\n",
              "from .identity import CoreIdentity, IdentityLedger\nfrom .disposition import ALLOWED_DISPOSITION_RESPONSES\n",
          )
          replace_once(
              "persona_engine/core/cartridge.py",
              '    "sensory_profile", "voice_profile", "avatar_profile", "cognitive_themes",\n    "concealment", "arc", "dialogue",\n',
              '    "sensory_profile", "voice_profile", "avatar_profile", "cognitive_themes",\n    "concealment", "arc", "dialogue", "behavior_profile",\n',
          )
          replace_once(
              "persona_engine/core/cartridge.py",
              '    "dialogue": _DIALOGUE_GROUPS,\n})\n',
              '    "dialogue": _DIALOGUE_GROUPS,\n    "behavior_profile": {\n        "intimacy_too_fast", "accusation", "contradiction", "manipulation",\n        "boredom", "disrespect", "emotional_overload",\n    },\n})\n',
          )
          replace_once(
              "persona_engine/core/cartridge.py",
              '    if "dialogue" in data:\n        _validate_dialogue(data["dialogue"])\n',
              '    if "dialogue" in data:\n        _validate_dialogue(data["dialogue"])\n    if "behavior_profile" in data:\n        for field, raw_value in data["behavior_profile"].items():\n            value = str(raw_value).strip().lower()\n            if value not in ALLOWED_DISPOSITION_RESPONSES:\n                raise CartridgeError(f"[behavior_profile].{field} has unsupported value: {raw_value}")\n',
          )
          replace_once(
              "persona_engine/core/cartridge.py",
              '        "cognitive_themes": data.get("cognitive_themes", {}), "concealment": data.get("concealment", {}),\n        "arc": data.get("arc", {}), "dialogue": dialogue, "entity_uuid": core.entity_uuid,\n',
              '        "cognitive_themes": data.get("cognitive_themes", {}), "concealment": data.get("concealment", {}),\n        "arc": data.get("arc", {}), "dialogue": dialogue, "behavior_profile": data.get("behavior_profile", {}),\n        "entity_uuid": core.entity_uuid,\n',
          )

          replace_once(
              "persona_engine/core/engine.py",
              "from .expression import build_envelope, relationship_expression_stance, select_resistance\n",
              "from .expression import build_envelope, relationship_expression_stance, select_resistance\nfrom .disposition import BehavioralDispositionProfile\n",
          )
          replace_once(
              "persona_engine/core/engine.py",
              '        profile_source = self.cartridge_data or {}\n        self.body_profile = BodyProfile.from_dict(profile_source.get("body_profile"))\n',
              '        profile_source = self.cartridge_data or {}\n        self.behavior_profile = BehavioralDispositionProfile.from_dict(profile_source.get("behavior_profile"))\n        self.body_profile = BodyProfile.from_dict(profile_source.get("body_profile"))\n',
          )
          replace_once(
              "persona_engine/core/engine.py",
              '        elif resistance == "shift_topic":\n            dialogue_act = "redirect"\n',
              '        elif resistance == "shift_topic":\n            dialogue_act = "redirect"\n        elif resistance == "decline":\n            dialogue_act = "decline"\n',
          )
          replace_once(
              "persona_engine/core/engine.py",
              "        resistance = select_resistance(triggers)\n",
              "        resistance = select_resistance(triggers, self.behavior_profile)\n",
          )

          profiles = {
              "persona_engine/cartridges/pretorius.snp": '''[behavior_profile]\nintimacy_too_fast = "deflect"\naccusation = "challenge"\ncontradiction = "challenge"\nmanipulation = "go_quiet"\nboredom = "shift_topic"\ndisrespect = "shorten"\nemotional_overload = "go_quiet"\n''',
              "persona_engine/cartridges/friendly.snp": '''[behavior_profile]\nintimacy_too_fast = "none"\naccusation = "none"\ncontradiction = "none"\nmanipulation = "deflect"\nboredom = "shift_topic"\ndisrespect = "shorten"\nemotional_overload = "go_quiet"\n''',
              "persona_engine/cartridges/rival.snp": '''[behavior_profile]\nintimacy_too_fast = "deflect"\naccusation = "challenge"\ncontradiction = "challenge"\nmanipulation = "challenge"\nboredom = "challenge"\ndisrespect = "challenge"\nemotional_overload = "go_quiet"\n''',
          }
          for path, profile in profiles.items():
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if "[behavior_profile]" in text:
                  raise SystemExit(f"behavior profile already exists in {path}")
              marker = "\n[body_profile]\n"
              if text.count(marker) != 1:
                  raise SystemExit(f"expected one body profile marker in {path}")
              file.write_text(text.replace(marker, "\n" + profile + marker, 1), encoding="utf-8")
          PY

      - name: Commit structural patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persona_engine/core/cartridge.py persona_engine/core/engine.py persona_engine/cartridges/pretorius.snp persona_engine/cartridges/friendly.snp persona_engine/cartridges/rival.snp
          git diff --cached --check
          git commit -m "Wire character-owned behavioral dispositions"
          git push origin HEAD:wayfarer-character-dispositions-phase
