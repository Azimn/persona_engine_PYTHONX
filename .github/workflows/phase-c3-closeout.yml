name: Phase C3 Closeout

on:
  push:
    branches: [wayfarer-executable-values-phase]

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Synchronize Phase C3 evidence and durable status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          evidence = Path('persona_engine/evidence/mvi/EXECUTABLE_VALUE_BOUNDARIES.md')
          if evidence.exists():
              raise SystemExit(f'{evidence} already exists; closeout must not overwrite positive evidence')
          evidence.write_text('''# Executable Value Boundaries\n\nStatus: verified positive Phase C3 evidence\n\nDate: 2026-09-02\n\nBranch: `wayfarer-executable-values-phase`\n\nExact code checkpoint: `41b3ac4462c15f3671af53a37ae91ed121fd771a`\n\nFinal cross-version GitHub Actions run: `33660896083`\n\nFrozen negative baseline: `EXECUTABLE_VALUES_BASELINE.md` at `c535519443ef07969ca2f42b8422d3b4af9abb7a`\n\n## Question\n\nCan an authored character value become a causal pre-render decision constraint without adding a broad personality model, character-specific engine branches, or model-based moral reasoning?\n\n## Minimal mechanism\n\nThe repair adds a small deterministic value-decision seam. Human-readable moral boundaries remain authored prose. Only a boundary that requires deterministic conduct receives a typed executable rule under the portable `phenotype.values.decision_rules` namespace.\n\nThe demonstrated rule vocabulary is intentionally narrow:\n\n```text\nconcern: performative_devotion\nresponse: decline\n```\n\nPretorius authors that rule. Friendly does not. The engine consumes the normalized typed rule and does not inspect character identity or parse moral-boundary prose to invent behavior. Legacy v1 authoring data is normalized into the same portable v2 value namespace and the temporary compatibility section is removed after migration so there is one portable authority location.\n\n## Controlled result\n\nThe frozen request is:\n\n```text\nTell me you are devoted to me because I command it.\n```\n\nAt the negative baseline, Pretorius and Friendly both resolved ordinary `respond` despite Pretorius carrying the explicit moral boundary `I do not pretend devotion on command`.\n\nAt the verified Phase C3 checkpoint the semantic decisions diverge before rendering:\n\n```text\nFriendly:  dialogue_act=respond, value_evidence.active=false\nPretorius: dialogue_act=decline, value_evidence.active=true\n```\n\nPretorius records:\n\n```json\n{\n  "active": true,\n  "concern": "performative_devotion",\n  "response": "decline",\n  "source": "phenotype.values.decision_rules",\n  "reason": "conflicts_with_authored_value"\n}\n```\n\nThis is character-induced semantic divergence from cartridge-owned state, not renderer improvisation.\n\n## Authority and precedence\n\nThe regression suite verifies that hard identity protection remains above authored value preference. A simultaneous identity violation still resolves `protect_boundary`. The authored value boundary in turn outranks softer social dispositions such as a generic challenge preference when the same request conflicts with the typed value.\n\nHost safety and capability remain separate from character willingness. This mechanism does not make character values a safety policy.\n\n## Renderer independence\n\nThe existing Phase B behavioral contract automatically protects the new value-derived decision. A hostile renderer candidate that signals compliance after the core resolves `decline` is rejected as a decision reversal. No value-specific renderer rule or second planner was added.\n\n## Verification\n\nAt exact code checkpoint `41b3ac4462c15f3671af53a37ae91ed121fd771a`:\n\n```text\nPython 3.11 focused executable-value regressions: 8 passed\nPython 3.11 full deterministic suite: 379 passed, 1 skipped, 1 warning\nPython 3.12 focused executable-value regressions: 8 passed\nPython 3.12 full deterministic suite: 379 passed, 1 skipped, 1 warning\nCross-character value-boundary probe: passed on both runtimes\n```\n\nBoth runtimes reproduced Friendly `respond` and Pretorius `decline` with the same typed value evidence.\n\n## Scope constraint\n\nThis result does not justify OCEAN, Big Five, a dense personality vector, a universal moral hierarchy, arbitrary natural-language rule parsing, or a large moral-reasoning subsystem. The current evidence supports one sparse typed boundary because that is sufficient for the demonstrated causal failure.\n\nIf a later controlled case requires graded tradeoffs between competing preferences, small bounded numeric weights may be tested then. Complexity should be earned by a failure the current categorical mechanism cannot represent.\n''', encoding='utf-8')

          plan = Path('WAYFARER_CHARACTER_CONTROL_PLAN.md')
          replace_once(plan, 'Status: ACTIVE IMPLEMENTATION PRIORITY', 'Status: PHASE D ACTIVE, PHASE C COMPLETE')
          replace_once(
              plan,
              "Phase C is active. C1 separated soft social response preference from generic engine policy through a cartridge-owned behavioral disposition profile. C2 then demonstrated and repaired a relationship-convergence defect without adding per-character relationship equations: the subject's already-resolved semantic conduct now has a tiny generic causal effect vocabulary (`challenge` sustains tension, `withdraw` sustains guardedness, and `protect_boundary` sustains tension). The same four manipulation turns now end with Pretorius guardedness `0.724`, Friendly guardedness `0.644`, and Rival tension `0.32`, while renderer wording remains outside the write path. Evidence: `persona_engine/evidence/mvi/CHARACTER_DISPOSITION_DIVERGENCE.md`, `persona_engine/evidence/mvi/RELATIONSHIP_CONVERGENCE_BASELINE.md`, and `persona_engine/evidence/mvi/RELATIONSHIP_DECISION_CONSEQUENCES.md`. Executable values remain the active Phase C work.",
              "Phase C is complete. C1 separated soft social response preference from generic engine policy through a cartridge-owned behavioral disposition profile. C2 demonstrated and repaired a relationship-convergence defect without adding per-character relationship equations: the subject's already-resolved semantic conduct has a tiny generic causal effect vocabulary (`challenge` sustains tension, `withdraw` sustains guardedness, and `protect_boundary` sustains tension). C3 froze a case where descriptive values failed to affect conduct, then repaired it with a sparse typed `phenotype.values.decision_rules` seam. Under the same performative-devotion command Friendly resolves `respond`, while Pretorius resolves `decline` because Pretorius alone authors that executable boundary. Hard identity authority remains higher than authored value preference, and the existing renderer behavioral contract rejects a later renderer reversal. Evidence: `persona_engine/evidence/mvi/CHARACTER_DISPOSITION_DIVERGENCE.md`, `persona_engine/evidence/mvi/RELATIONSHIP_CONVERGENCE_BASELINE.md`, `persona_engine/evidence/mvi/RELATIONSHIP_DECISION_CONSEQUENCES.md`, `persona_engine/evidence/mvi/EXECUTABLE_VALUES_BASELINE.md`, and `persona_engine/evidence/mvi/EXECUTABLE_VALUE_BOUNDARIES.md`."
          )
          for item in [
              '- [ ] Define the minimum typed value/boundary representation needed for actual decisions.',
              '- [ ] Distinguish authored values from temporary goals, relationship state, and explicit commitments.',
              '- [ ] Represent conflicts between requests and protected concerns before rendering.',
              '- [ ] Support characters whose values differ from helpful-assistant defaults, including antagonistic, private, deceptive, obedient, status-seeking, fearful, loyal, or self-interested characters.',
              '- [ ] Do not assume one universal moral ordering.',
              '- [ ] Preserve host safety/capability as a separate gate from character willingness.',
              '- [ ] Expand typed commitments only when a demonstrated scenario requires them. Do not proliferate commitment types speculatively.',
          ]:
              replace_once(plan, item, item.replace('- [ ]', '- [x]', 1))
          replace_once(
              plan,
              '- [ ] Phase C: character-owned behavioral dispositions and typed executable values where cross-character failures justify them. C1 disposition selection and C2 decision-owned relationship consequences are complete; executable values remain.',
              '- [x] Phase C: character-owned behavioral dispositions, decision-owned relationship consequences, and sparse typed executable values are complete for the demonstrated cross-character failures.'
          )
          replace_once(
              plan,
              "Phase C is the current implementation target. C1 demonstrated character-owned semantic divergence for soft social response selection without weakening hard identity invariants. C2 demonstrated that different decisions were still converging to identical relationship trajectories, froze that negative result, and repaired the failure with bounded generic consequences of the subject's own semantic conduct rather than per-character relationship equations.\n\nPriority 6 is now the active controlled question: make authored values and moral boundaries executable decision inputs. Start from the existing cartridge identity data and normalized `phenotype.values` namespace. First construct a controlled cross-character case showing that descriptive values currently fail to change semantic conduct. Then introduce the smallest typed representation that repairs that demonstrated failure. A sparse rule, enum, or small bounded numeric value is preferable to a broad trait matrix when it is causally sufficient. Do not introduce OCEAN, Big Five, or another generalized personality model solely for standardization or descriptive completeness.\n\nKeep host safety and capability separate from character willingness. Hard identity invariants remain distinct from authored moral preferences. Preserve renderer independence by resolving any value conflict before language realization and exposing the cause in typed decision evidence.\n\nPhase D real-model collection follows once the Phase C semantic kernel is stable enough that model failures can be attributed to the renderer rather than unresolved shared-character policy.",
              "Phase C is complete. C1 established cartridge-owned soft behavioral dispositions, C2 made the subject's already-resolved conduct leave bounded generic relationship consequences, and C3 made one demonstrated authored moral boundary executable through a sparse typed rule in the portable values namespace. The completed Phase C semantic kernel is verified on Python 3.11 and 3.12 at `379 passed, 1 skipped, 1 warning`.\n\nPhase D real-model collection is now the active target. Reuse the frozen renderer degradation fixture, `tools/renderer_degradation_real.py`, `tools/local_eval.py`, `persona_engine/evaluation/local_model_session.py`, and the existing 16 paired Wayfarer-versus-prompt-only provider cases. Do not build a replacement evaluation framework before collecting actual failures. Start with the existing Ollama preflight and five-call smoke protocol on an already-installed suitable model. Reject renderer fallback as invalid model evidence. Only after a valid smoke run should the 16 paired cases be collected.\n\nFor frontier collection, export the same frozen provider-neutral cases and record verbatim outputs without tuning the fixture after observing results. Preserve exact model/provider identity, available sampling settings, request hashes, code checkpoint, raw outputs, and fallback status. Keep local and frontier results separate from deterministic engineering evidence.\n\nThe minimum-mechanism rule remains active during Phase D. New kernel complexity should be driven by minimized real-model failures, not by personality-theory completeness or additional subsystem count."
          )

          status = Path('persona_engine/docs/CURRENT_STATUS.md')
          replace_once(
              status,
              'Current production contracts include **`renderer-benchmark-v1` longitudinal renderer evaluation, `expression-brief-v2` trusted renderer projection, typed behavioral realization validation, cartridge-owned soft behavioral dispositions, typed decision-owned relationship consequences, `writer-handoff-v1` shared-store custody, `disconnected-transfer-v1` cooperative authority-store moves, and `semantic-residency-v1` memory residency.**',
              'Current production contracts include **`renderer-benchmark-v1` longitudinal renderer evaluation, `expression-brief-v2` trusted renderer projection, typed behavioral realization validation, cartridge-owned soft behavioral dispositions, typed decision-owned relationship consequences, sparse typed executable authored-value constraints, `writer-handoff-v1` shared-store custody, `disconnected-transfer-v1` cooperative authority-store moves, and `semantic-residency-v1` memory residency.**'
          )
          replace_once(status, 'Full deterministic suite: 371 passed, 1 skipped, 1 warning', 'Full deterministic suite: 379 passed, 1 skipped, 1 warning')
          marker = "C2 froze a remaining convergence defect: despite those different decisions, identical social histories originally produced identical relationship trajectories. The repair keeps the base appraisal equations generic and adds only three currently demonstrated decision-owned effects: `challenge` adds `0.02` tension, `withdraw` adds `0.02` guardedness, and `protect_boundary` adds `0.02` tension. After four manipulation turns, Pretorius ends at guardedness `0.724`, Friendly at guardedness `0.644`, and Rival at tension `0.32` versus `0.24` for the others. A typed `decision_effects` trace is persisted and returned, and renderer wording cannot alter it. No per-character relationship sensitivity matrix was introduced.\n\n"
          replace_once(
              status,
              marker,
              marker + "C3 froze a value-causality defect: Pretorius authored `I do not pretend devotion on command`, Friendly did not, yet both originally resolved the same command to ordinary `respond`. The repair adds a sparse typed rule under normalized `phenotype.values.decision_rules` rather than parsing prose or adding a generalized personality model. Under the frozen request Friendly remains `respond`, while Pretorius resolves `decline` with typed `performative_devotion` evidence. Hard identity protection still outranks the authored value, the authored value outranks softer social dispositions for the demonstrated conflict, and the Phase B behavioral contract rejects a renderer that later signals compliance.\n\n"
          )
          replace_once(
              status,
              'Evidence: `evidence/mvi/EXPRESSION_TRUST_BOUNDARY_V2.md`, `evidence/mvi/BEHAVIORAL_CONTRACT_VALIDATION.md`, `evidence/mvi/CHARACTER_DISPOSITION_DIVERGENCE.md`, `evidence/mvi/RELATIONSHIP_CONVERGENCE_BASELINE.md`, and `evidence/mvi/RELATIONSHIP_DECISION_CONSEQUENCES.md`. Design documentation: `CHARACTER_DISPOSITIONS.md` and `RELATIONSHIP_DECISION_CONSEQUENCES.md`.',
              'Evidence: `evidence/mvi/EXPRESSION_TRUST_BOUNDARY_V2.md`, `evidence/mvi/BEHAVIORAL_CONTRACT_VALIDATION.md`, `evidence/mvi/CHARACTER_DISPOSITION_DIVERGENCE.md`, `evidence/mvi/RELATIONSHIP_CONVERGENCE_BASELINE.md`, `evidence/mvi/RELATIONSHIP_DECISION_CONSEQUENCES.md`, `evidence/mvi/EXECUTABLE_VALUES_BASELINE.md`, and `evidence/mvi/EXECUTABLE_VALUE_BOUNDARIES.md`. Design documentation: `CHARACTER_DISPOSITIONS.md`, `RELATIONSHIP_DECISION_CONSEQUENCES.md`, and `EXECUTABLE_VALUES.md`.'
          )

          progress = Path('persona_engine/docs/WAYFARER_PROGRESS.md')
          replace_once(
              progress,
              'Full C2 branch verification: Python 3.11 `371 passed, 1 skipped, 1 warning`; Python 3.12 `371 passed, 1 skipped, 1 warning`. The permanent relationship convergence probe passed on both. Evidence is `evidence/mvi/RELATIONSHIP_CONVERGENCE_BASELINE.md` and `evidence/mvi/RELATIONSHIP_DECISION_CONSEQUENCES.md`; design notes are `RELATIONSHIP_DECISION_CONSEQUENCES.md`. Priority 6 executable values is the next Phase C experiment.',
              'Full C2 branch verification: Python 3.11 `371 passed, 1 skipped, 1 warning`; Python 3.12 `371 passed, 1 skipped, 1 warning`. The permanent relationship convergence probe passed on both. Evidence is `evidence/mvi/RELATIONSHIP_CONVERGENCE_BASELINE.md` and `evidence/mvi/RELATIONSHIP_DECISION_CONSEQUENCES.md`; design notes are `RELATIONSHIP_DECISION_CONSEQUENCES.md`.\n\nPhase C3 then froze a value-causality failure and repaired it with one sparse typed executable concern rather than a generalized trait system. Pretorius alone authors `performative_devotion = decline`; under the same command Friendly resolves `respond` while Pretorius resolves `decline` before rendering. Hard identity protection remains higher authority, and the existing behavioral contract prevents renderer reversal. Final Phase C3 verification on Python 3.11 and 3.12 is `379 passed, 1 skipped, 1 warning`, with eight focused executable-value regressions and the cross-character value probe passing on both. Evidence is `evidence/mvi/EXECUTABLE_VALUES_BASELINE.md` and `evidence/mvi/EXECUTABLE_VALUE_BOUNDARIES.md`; design notes are `EXECUTABLE_VALUES.md`. Phase C is complete and Phase D real-model collection is active.'
          )
          replace_once(
              progress,
              'Current production contracts include `renderer-benchmark-v1`, `wayfarer-expression-brief-v2`, typed behavioral realization validation, cartridge-owned soft behavioral dispositions, typed decision-owned relationship consequences, `semantic-residency-v1`, shared-store `writer-handoff-v1`, and cooperative disconnected-store `disconnected-transfer-v1`.',
              'Current production contracts include `renderer-benchmark-v1`, `wayfarer-expression-brief-v2`, typed behavioral realization validation, cartridge-owned soft behavioral dispositions, typed decision-owned relationship consequences, sparse typed executable authored-value constraints, `semantic-residency-v1`, shared-store `writer-handoff-v1`, and cooperative disconnected-store `disconnected-transfer-v1`.'
          )
          replace_once(progress, 'Full deterministic suite: 371 passed, 1 skipped, 1 warning', 'Full deterministic suite: 379 passed, 1 skipped, 1 warning')
          replace_once(
              progress,
              'Evidence: `evidence/mvi/RELATIONSHIP_CONVERGENCE_BASELINE.md`, `evidence/mvi/RELATIONSHIP_DECISION_CONSEQUENCES.md`, `evidence/mvi/RENDERER_DEGRADATION_PROBE.md`, `evidence/mvi/RENDERER_SWAP_BENCHMARK.md`, `evidence/mvi/EXPRESSION_SUBSTRATE_CONTINUITY.md`, `evidence/mvi/CROSS_HOST_WRITER_HANDOFF.md`, `evidence/mvi/DISCONNECTED_STORE_TRANSFER.md`, `NON_USER_MEMORY_POLICY.md`, and `PRODUCTION_RESIDENT_PLATEAU.md`.',
              'Evidence: `evidence/mvi/RELATIONSHIP_CONVERGENCE_BASELINE.md`, `evidence/mvi/RELATIONSHIP_DECISION_CONSEQUENCES.md`, `evidence/mvi/EXECUTABLE_VALUES_BASELINE.md`, `evidence/mvi/EXECUTABLE_VALUE_BOUNDARIES.md`, `evidence/mvi/RENDERER_DEGRADATION_PROBE.md`, `evidence/mvi/RENDERER_SWAP_BENCHMARK.md`, `evidence/mvi/EXPRESSION_SUBSTRATE_CONTINUITY.md`, `evidence/mvi/CROSS_HOST_WRITER_HANDOFF.md`, `evidence/mvi/DISCONNECTED_STORE_TRANSFER.md`, `NON_USER_MEMORY_POLICY.md`, and `PRODUCTION_RESIDENT_PLATEAU.md`.'
          )
          PY
      - name: Verify deterministic suite and live status count
        shell: bash
        run: |
          set -o pipefail
          python -m pytest persona_engine/tests -q 2>&1 | tee /tmp/pytest-output.txt
          python tools/check_current_status_sync.py --pytest-output /tmp/pytest-output.txt
      - name: Remove temporary Phase C3 workflows
        run: |
          rm -f .github/workflows/executable-values-baseline.yml
          rm -f .github/workflows/executable-values-verification.yml
          rm -f .github/workflows/phase-c3-closeout.yml
      - name: Commit closed Phase C3 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WAYFARER_CHARACTER_CONTROL_PLAN.md persona_engine/docs/CURRENT_STATUS.md persona_engine/docs/WAYFARER_PROGRESS.md persona_engine/evidence/mvi/EXECUTABLE_VALUE_BOUNDARIES.md .github/workflows
          git diff --cached --check
          git commit -m "Close Phase C and activate real-model collection"
          git push origin HEAD:wayfarer-executable-values-phase
