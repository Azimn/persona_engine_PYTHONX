name: Ensemble CI

on:
  push:
    branches: [ensemble, 'ensemble-*']
  pull_request:
    branches: [ensemble]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run deterministic test suite
        run: python -m pytest persona_engine/tests -q

      - name: Run focused Ensemble tests
        run: python -m pytest persona_engine/tests/test_ensemble_realization.py persona_engine/tests/test_ensemble_renderer.py -q

      - name: Verify local Ensemble probe starts
        run: python tools/ensemble_relationship_probe.py --help > /dev/null
