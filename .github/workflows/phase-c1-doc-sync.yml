name: Phase C1 Documentation Sync

on:
  push:
    branches: [wayfarer-character-dispositions-phase]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize durable project documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          plan = "WAYFARER_CHARACTER_CONTROL_PLAN.md"
          replace_once(
              plan,
              "Created from external adversarial architecture review, 2026-09-02.\n\n",
              "Created from external adversarial architecture review, 2026-09-02.\n\n## Implementation Ledger\n\nPhase A is complete and merged into `wayfarer` at `42f9158aa0fcbf7dd6b65064204e20f4825bc1de`. It established the versioned renderer trust boundary, deterministic first-person subject projection, and least-privilege protected-value disclosure. Evidence: `persona_engine/evidence/mvi/EXPRESSION_TRUST_BOUNDARY_V2.md`.\n\nPhase B is complete and merged into `wayfarer` at `983301332b72cf639cea82bba13bd168668703d3`. It established typed behavioral realization validation so a renderer cannot silently reverse or omit an already-resolved character decision. Evidence: `persona_engine/evidence/mvi/BEHAVIORAL_CONTRACT_VALIDATION.md`.\n\nPhase C is active. C1 has separated soft social response preference from generic engine policy through a cartridge-owned behavioral disposition profile. The same manipulation stimulus now resolves to `withdraw` for Pretorius, `deflect` for Friendly, and `challenge` for Rival before rendering, while hard identity mutation remains core-owned. Evidence: `persona_engine/evidence/mvi/CHARACTER_DISPOSITION_DIVERGENCE.md`. Relationship appraisal dynamics and executable values remain active Phase C work.\n\n",
          )
          replace_once(
              plan,
              "- [ ] Phase A: versioned renderer trust boundary, raw-input separation, disclosure-aware projection, first-person subject position.\n- [ ] Phase B: behavioral contract validation against rendered output.\n- [ ] Phase C: character-owned behavioral dispositions and typed executable values where cross-character failures justify them.\n",
              "- [x] Phase A: versioned renderer trust boundary, raw-input separation, disclosure-aware projection, first-person subject position.\n- [x] Phase B: behavioral contract validation against rendered output.\n- [ ] Phase C: character-owned behavioral dispositions and typed executable values where cross-character failures justify them. C1 disposition selection is complete; relationship dynamics and executable values remain.\n",
          )
          old_active = """## Immediate Active Work\n\nThe next implementation phase starts with Priority 0, Priority 1, and Priority 2 together because they share the renderer boundary:\n\n- [ ] Introduce a versioned expression contract that keeps raw user input out of the privileged control block.\n- [ ] Separate trusted control state from untrusted evidence/memory text.\n- [ ] Add a deterministic first-person subject-position projection.\n- [ ] Redact protected values from renderer-visible state when the decision does not permit disclosure.\n- [ ] Add regression tests for prompt-injection text in current input and retrieved memory.\n- [ ] Add regression tests proving protected values are absent from renderer messages.\n- [ ] Preserve the existing frozen v1 benchmark artifacts as historical evidence.\n- [ ] Run the focused renderer/consistency tests, then the full deterministic suite.\n- [ ] Update project status and evidence before merging.\n\nA future agent should begin here rather than inventing a new priority list from chat history."""
          new_active = """## Immediate Active Work\n\nPhase C is the current implementation target. C1 has demonstrated character-owned semantic divergence for soft social response selection without weakening hard identity invariants.\n\nThe next controlled question is relationship convergence. Friendly, Rival, and Pretorius still pass through the same base trust, tension, attachment, respect, guardedness, and unresolved-conflict equations before their later conduct can diverge. Do not add broad personality constants merely because this is visible in code. First create controlled identical-history comparisons that demonstrate a behaviorally meaningful failure, then introduce the smallest character-owned sensitivity contract that repairs that failure.\n\nAfter relationship dynamics are supported by evidence, continue Priority 6 by making authored values and moral boundaries executable decision inputs. Host safety and capability remain separate from character willingness.\n\nPhase D real-model collection follows once the Phase C semantic kernel is stable enough that model failures can be attributed to the renderer rather than unresolved shared-character policy.\n\nA future agent should begin here rather than inventing a new priority list from chat history."""
          replace_once(plan, old_active, new_active)

          status = "persona_engine/docs/CURRENT_STATUS.md"
          replace_once(
              status,
              "Current production contracts include **`renderer-benchmark-v1` longitudinal renderer evaluation, `expression-brief-v1` renderer independence, `writer-handoff-v1` shared-store custody, `disconnected-transfer-v1` cooperative authority-store moves, and `semantic-residency-v1` memory residency.**",
              "Current production contracts include **`renderer-benchmark-v1` longitudinal renderer evaluation, `expression-brief-v2` trusted renderer projection, typed behavioral realization validation, cartridge-owned soft behavioral dispositions, `writer-handoff-v1` shared-store custody, `disconnected-transfer-v1` cooperative authority-store moves, and `semantic-residency-v1` memory residency.**",
          )
          replace_once(status, "Full deterministic suite: 362 passed, 1 skipped, 1 warning", "Full deterministic suite: 366 passed, 1 skipped, 1 warning")
          marker = "The remaining warning is the existing Starlette/httpx TestClient deprecation, not a Wayfarer behavioral failure.\n\n"
          addition = """The remaining warning is the existing Starlette/httpx TestClient deprecation, not a Wayfarer behavioral failure.\n\n## Character-control plane checkpoint\n\nThe current renderer boundary is `wayfarer-expression-brief-v2`. Trusted character-control state is separated from untrusted current input and natural-language evidence, the model receives deterministic first-person subject framing derived from structured state, and protected values can be withheld from renderer-visible context.\n\nThe consistency layer now validates behavioral realization of the already-resolved decision. A direct decision reversal is critical; omission of a required refusal or boundary is hard and receives one bounded constrained retry before fallback. The validator remains a fidelity checker rather than a second planner.\n\nCharacter disposition C1 moves seven soft social-response preferences out of universal engine policy and into cartridge-owned data. In the current cross-character regression, identical manipulation resolves to `withdraw` for Pretorius, `deflect` for Friendly, and `challenge` for Rival before rendering. Hard identity mutation remains a core-owned `character_refusal` for all three. Relationship appraisal equations remain generic and are the next explicit convergence question.\n\nEvidence: `evidence/mvi/EXPRESSION_TRUST_BOUNDARY_V2.md`, `evidence/mvi/BEHAVIORAL_CONTRACT_VALIDATION.md`, and `evidence/mvi/CHARACTER_DISPOSITION_DIVERGENCE.md`. Design documentation: `CHARACTER_DISPOSITIONS.md`.\n\n"""
          replace_once(status, marker, addition)
          replace_once(
              status,
              "## Expression-substrate continuity checkpoint\n\n`expression-brief-v1` makes the already-resolved character moment the common language-rendering boundary.",
              "## Expression-substrate continuity checkpoint\n\nThe `expression-brief-v1` material in this section is preserved as historical checkpoint evidence. Current production uses `wayfarer-expression-brief-v2` as described above.\n\n`expression-brief-v1` made the already-resolved character moment the common language-rendering boundary.",
          )

          progress = "persona_engine/docs/WAYFARER_PROGRESS.md"
          replace_once(progress, "Last updated: 2026-09-01", "Last updated: 2026-09-02")
          progress_marker = "Use `git switch wayfarer` before evaluating current behavior. Do not advance the frozen baseline merely to make it current.\n\n"
          progress_addition = """Use `git switch wayfarer` before evaluating current behavior. Do not advance the frozen baseline merely to make it current.\n\n## 2026-09-02 character-control-plane checkpoint\n\nPhase A and Phase B of `WAYFARER_CHARACTER_CONTROL_PLAN.md` are complete. Phase A established `wayfarer-expression-brief-v2`, trusted versus untrusted renderer context, deterministic first-person subject projection, and least-privilege protected-value disclosure. Phase B added typed behavioral realization validation for decision reversal and required-decision omission.\n\nPhase C1 now separates soft social response preference from global engine policy. The engine owns a small bounded response vocabulary and hard identity invariants; cartridges own seven soft trigger preferences. The same manipulation stimulus produces three different pre-render semantic acts in the current fixtures: Pretorius `withdraw`, Friendly `deflect`, and Rival `challenge`. Identical identity mutation still produces core-owned `character_refusal` for all three.\n\nFull branch verification after C1: Python 3.11 `366 passed, 1 skipped, 1 warning`; Python 3.12 also green with the same inventory. Evidence is `evidence/mvi/CHARACTER_DISPOSITION_DIVERGENCE.md`; design notes are `CHARACTER_DISPOSITIONS.md`. Relationship appraisal dynamics remain shared and are the next Phase C convergence experiment.\n\n"""
          replace_once(progress, progress_marker, progress_addition)
          replace_once(
              progress,
              "Current production contracts include `renderer-benchmark-v1`, `expression-brief-v1`, `semantic-residency-v1`, shared-store `writer-handoff-v1`, and cooperative disconnected-store `disconnected-transfer-v1`.",
              "Current production contracts include `renderer-benchmark-v1`, `wayfarer-expression-brief-v2`, typed behavioral realization validation, cartridge-owned soft behavioral dispositions, `semantic-residency-v1`, shared-store `writer-handoff-v1`, and cooperative disconnected-store `disconnected-transfer-v1`.",
          )
          replace_once(progress, "Full deterministic suite: 357 passed, 1 skipped, 1 warning in 32.66s", "Full deterministic suite: 366 passed, 1 skipped, 1 warning")
          PY

      - name: Commit documentation sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WAYFARER_CHARACTER_CONTROL_PLAN.md persona_engine/docs/CURRENT_STATUS.md persona_engine/docs/WAYFARER_PROGRESS.md
          git diff --cached --check
          git commit -m "Synchronize Phase C1 durable project status"
          git push origin HEAD:wayfarer-character-dispositions-phase
