name: Wayfarer bounded diagnostic persistence

on:
  push:
    branches: [wayfarer]
    paths:
      - 'WAYFARER_BOUNDED_DIAGNOSTICS_TRIGGER.txt'
      - '.github/workflows/wayfarer-bounded-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply bounded diagnostic persistence patch
        run: python tools/_integrate_bounded_diagnostics.py
      - name: Run focused persistence and developmental tests
        run: |
          python -m pytest \
            persona_engine/tests/test_bounded_diagnostic_persistence.py \
            persona_engine/tests/test_continuity_ledger.py \
            persona_engine/tests/test_continuity_replay.py \
            persona_engine/tests/test_dream_engine.py \
            persona_engine/tests/test_role_bounded_user_memory.py \
            persona_engine/tests/test_bounded_rehearsal_trace.py -q
      - name: Run full deterministic suite
        run: python -m pytest -q
      - name: Measure post-change storage
        run: |
          python tools/persistence_storage_probe.py --turns 1000 \
            --json persona_engine/evidence/mvi/persistence_storage_probe.json \
            --markdown persona_engine/evidence/mvi/PERSISTENCE_STORAGE_PROBE.md
      - name: Commit runtime policy and evidence
        run: |
          rm -f tools/_integrate_bounded_diagnostics.py
          rm -f .github/workflows/wayfarer-bounded-diagnostics.yml
          rm -f WAYFARER_BOUNDED_DIAGNOSTICS_TRIGGER.txt
          git config user.name 'Wayfarer Bounded Diagnostics'
          git config user.email 'wayfarer-bounded-diagnostics@users.noreply.github.com'
          git add -A
          git commit -m 'Separate durable biography from diagnostic telemetry'
          git push origin HEAD:wayfarer
