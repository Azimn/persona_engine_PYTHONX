name: Wayfarer cold biography read-through

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify pre-integration continuity state
        run: |
          python -m pytest \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_subject_state_scope.py \
            persona_engine/tests/test_subject_sequence.py -q
      - name: Apply cold biography read-through
        run: python tools/apply_cold_biography_readthrough.py
      - name: Run focused cold-biography tests
        run: |
          python -m pytest \
            persona_engine/tests/test_cold_biography.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_commitment_constraint.py \
            persona_engine/tests/test_subject_state_scope.py -q
      - name: Regenerate cold-biography evidence
        run: |
          python tools/cold_biography_readthrough_probe.py \
            --json persona_engine/evidence/mvi/cold_biography_readthrough.json \
            --markdown persona_engine/evidence/mvi/COLD_BIOGRAPHY_READTHROUGH.md
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Commit integrated read-through and evidence
        run: |
          rm -f tools/apply_cold_biography_readthrough.py .github/workflows/wayfarer-cold-biography-readthrough.yml
          git config user.name 'Wayfarer Cold Biography Integration'
          git config user.email 'wayfarer-cold-biography-integration@users.noreply.github.com'
          git add -A
          git commit -m 'Add bounded cold-biography read-through'
          git push origin HEAD:wayfarer
