name: Wayfarer M1 Maintenance

on:
  push:
    branches: [wayfarer]
    paths:
      - WAYFARER_M1_TRIGGER.txt

permissions:
  contents: write

jobs:
  m1-maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Configure commit identity
        run: |
          git config user.name "Wayfarer Maintenance"
          git config user.email "wayfarer-maintenance@users.noreply.github.com"
      - name: Step 1 - renderer bootstrap decoupling
        run: |
          python tools/wayfarer_m1_patch_v2.py step1
          python -m compileall -q persona_engine
          python -m pytest persona_engine/tests/test_wayfarer_renderer_identity.py -q
          git add persona_engine/core/engine.py persona_engine/tests/test_wayfarer_renderer_identity.py
          git commit -m "Decouple default renderer from character identity"
      - name: Step 2 - character-scoped ontology
        run: |
          python tools/wayfarer_m1_patch_v2.py step2
          python -m compileall -q persona_engine
          python -m pytest persona_engine/tests/test_engine.py persona_engine/tests/test_wayfarer_renderer_identity.py persona_engine/tests/test_wayfarer_ontology.py -q
          git add persona_engine/core persona_engine/cartridges persona_engine/tests
          git commit -m "Move ontology policy into character scope"
      - name: Full regression suite
        run: python -m pytest persona_engine/tests -q
      - name: Push ordered M1 commits
        run: git push origin HEAD:wayfarer
