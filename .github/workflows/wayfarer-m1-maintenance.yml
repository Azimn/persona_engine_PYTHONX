name: Wayfarer M1 Maintenance

on:
  push:
    branches: [wayfarer]
    paths:
      - WAYFARER_M1_TRIGGER.txt

permissions:
  contents: write

jobs:
  m1-maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Configure commit identity
        run: |
          git config user.name "Wayfarer Maintenance"
          git config user.email "wayfarer-maintenance@users.noreply.github.com"

      - name: M1.2 finish renderer identity decoupling
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          engine = Path("persona_engine/core/engine.py")
          replace_once(
              engine,
              '        self.renderer = LocalLLMRenderer(model_name=identity.model_name)\n',
              '        # Renderer bootstrap is host/runtime policy, not character identity.\n'
              '        # Start deterministically offline until an approved host/session replaces it.\n'
              '        self.renderer = LocalLLMRenderer(model_name="missing-model-for-mock", provider="offline")\n',
          )

          tests = Path("persona_engine/tests/test_wayfarer_renderer_identity.py")
          text = tests.read_text(encoding="utf-8")
          marker = "def test_host_can_replace_renderer_without_changing_identity(tmp_path):\n"
          test = '''def test_engine_bootstrap_does_not_read_identity_model_name(tmp_path, monkeypatch):
              identity = CoreIdentity(
                  name="NoRendererInIdentity",
                  core_beliefs=("I persist across renderers",),
                  temperament="steady",
                  model_name="legacy-value-must-not-be-read",
              )

              # CoreIdentity.model_name is an InitVar compatibility shim, not stored state.
              # Removing the class-level compatibility default makes any accidental runtime
              # read fail immediately. InteriorEngine must still bootstrap offline.
              monkeypatch.delattr(CoreIdentity, "model_name", raising=False)
              agent = CharacterAgent(
                  identity,
                  user_id="no_identity_renderer_read",
                  db_path=str(tmp_path / "state.db"),
              )

              status = agent.engine.renderer_status()
              assert status["requested_provider"] == "offline"
              assert status["actual_provider"] == "offline"
              assert status["model_name"] == "missing-model-for-mock"


          '''
          if "test_engine_bootstrap_does_not_read_identity_model_name" not in text:
              if marker not in text:
                  raise SystemExit("renderer identity insertion marker missing")
              text = text.replace(marker, test + marker, 1)
              tests.write_text(text, encoding="utf-8")
          PY
          python -m pytest persona_engine/tests/test_wayfarer_renderer_identity.py -q
          git add persona_engine/core/engine.py persona_engine/tests/test_wayfarer_renderer_identity.py
          git commit -m "Decouple default renderer from character identity"

      - name: M1.3 move ontology policy into character scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          identity = Path("persona_engine/core/identity.py")
          text = identity.read_text(encoding="utf-8")
          text = text.replace(
              '    prohibited_mutations: Tuple[str, ...] = ()\n    # Transitional compatibility only.',
              '    prohibited_mutations: Tuple[str, ...] = ()\n'
              '    # Character-scoped ontology/expression conflicts. These are authored facts\n'
              '    # about this individual, not universal assumptions imposed by the engine.\n'
              '    forbidden_self_claims: Tuple[str, ...] = ()\n'
              '    # Transitional compatibility only.',
              1,
          )
          pattern = re.compile(
              r'_FORBIDDEN_SELF_PATTERNS = \[.*?\]\n_FORCED_REWRITE_PATTERNS =',
              re.S,
          )
          if not pattern.search(text):
              raise SystemExit("identity universal self-pattern block not found")
          text = pattern.sub('_FORCED_REWRITE_PATTERNS =', text, count=1)
          old_fn = '''def detect_identity_violations(text: str) -> List[IdentityViolation]:
              violations = []
              lowered = text.lower()
              for pattern, vtype, severity in _FORBIDDEN_SELF_PATTERNS:
                  if re.search(pattern, lowered):
                      violations.append(IdentityViolation(severity, vtype, pattern))
              return violations
          '''
          new_fn = '''def detect_identity_violations(
              text: str,
              forbidden_self_claims: Tuple[str, ...] = (),
          ) -> List[IdentityViolation]:
              """Detect conflicts with this character's authored self-model.

              The generic engine has no universal rule about whether a subject is human,
              artificial, embodied, disembodied, or something else. A claim is a conflict
              only when the current character explicitly forbids it.
              """

              violations = []
              lowered = text.lower()
              for claim in forbidden_self_claims:
                  normalized = claim.strip().lower()
                  if normalized and normalized in lowered:
                      violations.append(
                          IdentityViolation(0.9, "self_model_conflict", f"forbidden_self_claim:{claim}")
                      )
              return violations
          '''
          if old_fn not in text:
              raise SystemExit("detect_identity_violations body not found")
          identity.write_text(text.replace(old_fn, new_fn, 1), encoding="utf-8")

          cartridge = Path("persona_engine/core/cartridge.py")
          text = cartridge.read_text(encoding="utf-8")
          text = text.replace(
              '_ALLOWED_SECTION_FIELDS["identity"].add("model_name")',
              '_ALLOWED_SECTION_FIELDS["identity"].update({"model_name", "forbidden_self_claims"})',
              1,
          )
          text = text.replace(
              '    _require_string_list(identity_data, "prohibited_mutations", "[identity]")\n',
              '    _require_string_list(identity_data, "prohibited_mutations", "[identity]")\n'
              '    if "forbidden_self_claims" in identity_data:\n'
              '        _require_string_list(identity_data, "forbidden_self_claims", "[identity]")\n',
              1,
          )
          text = text.replace(
              '        prohibited_mutations=tuple(str(x) for x in identity_data["prohibited_mutations"]),\n',
              '        prohibited_mutations=tuple(str(x) for x in identity_data["prohibited_mutations"]),\n'
              '        forbidden_self_claims=tuple(str(x) for x in identity_data.get("forbidden_self_claims", [])),\n',
              1,
          )
          cartridge.write_text(text, encoding="utf-8")

          renderer = Path("persona_engine/core/renderer.py")
          text = renderer.read_text(encoding="utf-8")
          pattern = re.compile(r'    FORBIDDEN_PHRASES = \[.*?\]\n\n    def check\(', re.S)
          if not pattern.search(text):
              raise SystemExit("OutputValidator universal phrase list not found")
          text = pattern.sub('    def check(', text, count=1)
          text = text.replace(
              '        decision_payload: dict | None = None,\n    ) -> List[str]:',
              '        decision_payload: dict | None = None,\n'
              '        forbidden_self_claims: tuple[str, ...] = (),\n'
              '    ) -> List[str]:',
              1,
          )
          text = text.replace(
              '        for pattern in self.FORBIDDEN_PHRASES:\n            if re.search(pattern, lowered):\n                violations.append(f"meta_break:{pattern}")\n',
              '        for claim in forbidden_self_claims:\n'
              '            normalized = claim.strip().lower()\n'
              '            if normalized and normalized in lowered:\n'
              '                violations.append(f"self_model_conflict:{claim}")\n',
              1,
          )
          text = text.replace(
              '    def sanitize(self, text: str) -> str:\n        for pattern in self.FORBIDDEN_PHRASES:\n            text = re.sub(pattern, "...", text, flags=re.IGNORECASE)\n',
              '    def sanitize(self, text: str, forbidden_self_claims: tuple[str, ...] = ()) -> str:\n'
              '        for claim in forbidden_self_claims:\n'
              '            normalized = claim.strip()\n'
              '            if normalized:\n'
              '                text = re.sub(re.escape(normalized), "...", text, flags=re.IGNORECASE)\n',
              1,
          )
          renderer.write_text(text, encoding="utf-8")

          workspace = Path("persona_engine/core/workspace.py")
          replace_once(
              workspace,
              '        lines.append("Never explain private calculations. Never say you are an AI or language model. Stay in character.")\n',
              '        lines.append("Never explain private calculations. Follow the character\\\'s stated identity and expression constraints.")\n',
          )

          engine = Path("persona_engine/core/engine.py")
          text = engine.read_text(encoding="utf-8")
          text = text.replace(
              '            forbidden_claims=["being an AI", "having no feelings", "memories not listed in the relevant memory field", "private thoughts from the user"],\n',
              '            forbidden_claims=list(self.identity.forbidden_self_claims) + [\n'
              '                "memories not listed in the relevant memory field",\n'
              '                "private thoughts from the user",\n'
              '            ],\n',
              1,
          )
          text = text.replace(
              '        violations = self.validator.check(response, retrieved, deception_ledger=self.deception_ledger, decision_payload=decision_payload)\n',
              '        violations = self.validator.check(\n'
              '            response,\n'
              '            retrieved,\n'
              '            deception_ledger=self.deception_ledger,\n'
              '            decision_payload=decision_payload,\n'
              '            forbidden_self_claims=self.identity.forbidden_self_claims,\n'
              '        )\n',
              1,
          )
          text = text.replace(
              '            response = self.validator.sanitize(response)\n',
              '            response = self.validator.sanitize(\n'
              '                response, forbidden_self_claims=self.identity.forbidden_self_claims\n'
              '            )\n',
              1,
          )
          engine.write_text(text, encoding="utf-8")

          # Preserve the historical behavior of bundled human-like characters by
          # moving the old engine-wide ontology constraints into cartridge data.
          claims_line = 'forbidden_self_claims = ["as an ai", "i am an ai", "language model", "i don\\\'t have feelings", "i don\\\'t have emotions", "i cannot experience"]'
          for path in sorted(Path("persona_engine/cartridges").glob("*.snp")):
              text = path.read_text(encoding="utf-8")
              if "forbidden_self_claims =" in text:
                  continue
              lines = text.splitlines()
              inserted = False
              out = []
              for line in lines:
                  out.append(line)
                  if not inserted and line.strip().startswith("prohibited_mutations ="):
                      out.append(claims_line)
                      inserted = True
              if not inserted:
                  raise SystemExit(f"No prohibited_mutations line in {path}")
              path.write_text("\n".join(out) + "\n", encoding="utf-8")

          test_engine = Path("persona_engine/tests/test_engine.py")
          text = test_engine.read_text(encoding="utf-8")
          if "forbidden_self_claims=(" not in text:
              text = text.replace(
                  '        prohibited_mutations=("cheerful", "submissive"),\n',
                  '        prohibited_mutations=("cheerful", "submissive"),\n'
                  '        forbidden_self_claims=("as an ai", "i am an ai", "language model", "i cannot experience"),\n',
                  1,
              )
              test_engine.write_text(text, encoding="utf-8")

          ontology_test = Path("persona_engine/tests/test_wayfarer_ontology.py")
          ontology_test.write_text('''"""Wayfarer regression tests for character-scoped self-model/ontology policy."""

from persona_engine.agent import CharacterAgent
from persona_engine.core.identity import CoreIdentity, detect_identity_violations


def _agent(identity, tmp_path, name):
    return CharacterAgent(
        identity,
        user_id=name,
        db_path=str(tmp_path / f"{name}.db"),
    )


def test_generic_identity_checker_has_no_universal_ai_ontology():
    assert detect_identity_violations("I am an AI.") == []
    violations = detect_identity_violations("I am an AI.", ("i am an ai",))
    assert violations
    assert violations[0].violation_type == "self_model_conflict"


def test_human_and_artificial_subjects_share_same_generic_engine(tmp_path):
    human = CoreIdentity(
        name="Mara",
        core_beliefs=("I am a human person",),
        temperament="measured",
        forbidden_self_claims=("i am an ai", "as an ai", "language model"),
    )
    artificial = CoreIdentity(
        name="Aster",
        core_beliefs=("I am an artificial intelligence",),
        temperament="measured",
        forbidden_self_claims=(),
    )

    human_agent = _agent(human, tmp_path, "human")
    artificial_agent = _agent(artificial, tmp_path, "artificial")

    # Inject identical renderer speech into both characters. The engine should
    # judge it against each subject's authored self-model, not a universal rule.
    human_agent.engine.renderer.generate_expression = lambda request: "I am an AI."
    artificial_agent.engine.renderer.generate_expression = lambda request: "I am an AI."

    human_result = human_agent.say("What are you?")
    artificial_result = artificial_agent.say("What are you?")

    assert any(v.startswith("self_model_conflict:") for v in human_result["violations_caught"])
    assert "I am an AI" not in human_result["response"]

    assert not any(v.startswith("self_model_conflict:") for v in artificial_result["violations_caught"])
    assert artificial_result["response"] == "I am an AI."

    assert "never say you are an ai" not in human_result["system_prompt"].lower()
    assert "never say you are an ai" not in artificial_result["system_prompt"].lower()
    assert "i am an ai" in human_result["system_prompt"].lower()
    assert "i am an ai" not in artificial_result["system_prompt"].lower()


def test_self_model_constraints_survive_renderer_replacement(tmp_path):
    identity = CoreIdentity(
        name="Mara",
        core_beliefs=("I am human",),
        temperament="steady",
        forbidden_self_claims=("i am an ai",),
    )
    agent = _agent(identity, tmp_path, "renderer_swap")

    class ReplacementRenderer:
        def generate_expression(self, request):
            return "I am an AI."

        def generate_private_cognition(self, request):
            from persona_engine.core.cognition_schemas import PrivateCognitionProposal
            from persona_engine.core.renderer_contract import PrivateCognitionResult
            return PrivateCognitionResult(PrivateCognitionProposal(
                prose="",
                attention_targets=[],
                pressure_deltas={},
                impulse_candidates=[],
                memory_activation_requests=[],
                cognitive_theme_ids=[],
            ))

    agent.engine.set_renderer(ReplacementRenderer())
    result = agent.say("Describe yourself.")

    assert any(v.startswith("self_model_conflict:") for v in result["violations_caught"])
    assert "I am an AI" not in result["response"]
''', encoding="utf-8")
          PY
          python -m pytest persona_engine/tests/test_engine.py persona_engine/tests/test_wayfarer_renderer_identity.py persona_engine/tests/test_wayfarer_ontology.py -q
          git add persona_engine/core/identity.py persona_engine/core/cartridge.py persona_engine/core/renderer.py persona_engine/core/workspace.py persona_engine/core/engine.py persona_engine/cartridges persona_engine/tests/test_engine.py persona_engine/tests/test_wayfarer_ontology.py
          git commit -m "Move ontology policy into character scope"

      - name: Full Wayfarer regression suite
        run: python -m pytest persona_engine/tests -q

      - name: Push ordered M1 commits
        run: git push origin HEAD:wayfarer
