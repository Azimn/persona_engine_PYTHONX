name: Wayfarer subject clock ownership probe

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify subject ordering contract
        run: |
          python -m pytest persona_engine/tests/test_subject_sequence.py persona_engine/tests/test_interlocutor_subject_state.py -q
      - name: Run subject clock ownership probe
        run: |
          python tools/subject_clock_ownership_probe.py \
            --json persona_engine/evidence/mvi/subject_clock_ownership.json \
            --markdown persona_engine/evidence/mvi/SUBJECT_CLOCK_OWNERSHIP.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-subject-clock-probe.yml
          git config user.name 'Wayfarer Subject Clock Probe'
          git config user.email 'wayfarer-clock-probe@users.noreply.github.com'
          git add -A
          git commit -m 'Capture subject clock ownership evidence'
          git push origin HEAD:wayfarer
