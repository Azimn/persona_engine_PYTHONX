name: Wayfarer minimum runtime footprint probe

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify current minimal continuity contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_subject_state_scope.py \
            persona_engine/tests/test_subject_sequence.py \
            persona_engine/tests/test_continuity_clock.py \
            persona_engine/tests/test_commitment_constraint.py \
            persona_engine/tests/test_history_decision_evidence.py -q
      - name: Run runtime footprint probe
        run: |
          python tools/minimum_runtime_footprint_probe.py \
            --json persona_engine/evidence/mvi/minimum_runtime_footprint.json \
            --markdown persona_engine/evidence/mvi/MINIMUM_RUNTIME_FOOTPRINT.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-runtime-footprint-probe.yml
          git config user.name 'Wayfarer Runtime Footprint Probe'
          git config user.email 'wayfarer-footprint@users.noreply.github.com'
          git add -A
          git commit -m 'Capture no-LLM runtime footprint baseline'
          git push origin HEAD:wayfarer
