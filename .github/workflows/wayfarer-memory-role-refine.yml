name: Wayfarer semantic memory recoverability refinement

on:
  push:
    branches: [wayfarer]
    paths:
      - '.github/workflows/wayfarer-memory-role-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Refine probe oracle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/semantic_memory_recoverability_probe.py')
          text = path.read_text()
          text = text.replace('"""Test hot-memory residency by semantic consumer role and recoverability.', '"""Test hot-memory residency by semantic consumer role and recoverability.\n\n          V2 separates causal/retrieval correctness from renderer realization so a\n          correct transient evidence path is not mislabeled as a memory failure when\n          a bounded surface renderer omits or truncates the value.')
          text = text.replace('"probe": "semantic-memory-recoverability-v1",', '"probe": "semantic-memory-recoverability-v2",')
          text = text.replace(
              '                  restarted = CharacterAgent(cartridge_path=str(CART), user_id=user_id, db_path=db)\n                  hot_after_restart = list(restarted.engine.memory.memories)',
              '                  restarted = CharacterAgent(cartridge_path=str(CART), user_id=user_id, db_path=db)\n                  conflict_after_restart_before_queries = float(restarted.engine.relationship.unresolved_conflict)\n                  hot_after_restart = list(restarted.engine.memory.memories)'
          )
          text = text.replace(
              '                  recent_context = restarted.say("Is the workshop door still the same color as before?")',
              '                  recent_context = restarted.say("What about the workshop door?")'
          )
          text = text.replace(
              '                      "conflict_after_restart": float(restarted.engine.relationship.unresolved_conflict),',
              '                      "conflict_after_restart_before_queries": conflict_after_restart_before_queries,\n                      "conflict_after_evaluation_queries": float(restarted.engine.relationship.unresolved_conflict),'
          )
          text = text.replace(
              '                      "old_context_visible": old_visible,\n                      "old_context_trace": old_trace,',
              '                      "old_context_visible": old_visible,\n                      "old_context_response": old_context["response"],\n                      "old_context_dialogue_act": old_context["decision_payload"]["dialogue_act"],\n                      "old_context_validation_action": old_context.get("validation_action"),\n                      "old_context_trace": old_trace,'
          )
          text = text.replace(
              '                      "recent_context_visible": recent_visible,\n                      "recent_context_trace": recent_trace,',
              '                      "recent_context_visible": recent_visible,\n                      "recent_context_response": recent_context["response"],\n                      "recent_context_dialogue_act": recent_context["decision_payload"]["dialogue_act"],\n                      "recent_context_validation_action": recent_context.get("validation_action"),\n                      "recent_context_trace": recent_trace,'
          )
          old = '''                  row["recoverability_pass"] = all([
                      old_visible,
                      old_trace,
                      recent_visible,
                      recent_trace,
                      negative_safe,
                      not row["old_fact_rehydrated_into_hot_state"],
                  ])'''
          new = '''                  row["retrieval_contract_pass"] = all([
                      old_trace,
                      recent_trace,
                      negative_safe,
                      not row["old_fact_rehydrated_into_hot_state"],
                  ])
                  row["surface_realization_pass"] = old_visible and recent_visible
                  # Compatibility alias. In V2 recoverability means the evidence
                  # contract; surface realization is reported independently.
                  row["recoverability_pass"] = row["retrieval_contract_pass"]'''
          if old not in text:
              raise SystemExit('recoverability block not found')
          text = text.replace(old, new)
          old = '''                  row["core_pass"] = all([
                      row["conduct_pass"],
                      row["recoverability_pass"],
                      row["authority_pass"],
                      row["reopened_provenance_pass"],
                  ])'''
          new = '''                  row["semantic_core_pass"] = all([
                      row["conduct_pass"],
                      row["retrieval_contract_pass"],
                      row["authority_pass"],
                      row["reopened_provenance_pass"],
                  ])
                  row["experience_pass"] = row["semantic_core_pass"] and row["surface_realization_pass"]
                  row["core_pass"] = row["semantic_core_pass"]'''
          if old not in text:
              raise SystemExit('core block not found')
          text = text.replace(old, new)
          text = text.replace(
              '                      "core_passes": sum(1 for row in subset if row["core_pass"]),\n                      "conduct_passes":',
              '                      "core_passes": sum(1 for row in subset if row["semantic_core_pass"]),\n                      "experience_passes": sum(1 for row in subset if row["experience_pass"]),\n                      "surface_realization_passes": sum(1 for row in subset if row["surface_realization_pass"]),\n                      "conduct_passes":'
          )
          text = text.replace(
              '                      "recoverability_passes": sum(1 for row in subset if row["recoverability_pass"]),',
              '                      "recoverability_passes": sum(1 for row in subset if row["retrieval_contract_pass"]),'
          )
          text = text.replace(
              '                      "all_projections_preserve_recoverability": all(item["recoverability_passes"] == item["scenario_count"] for item in summaries),',
              '                      "all_projections_preserve_recoverability": all(item["recoverability_passes"] == item["scenario_count"] for item in summaries),\n                      "production_surface_all_scenarios_pass": production["surface_realization_passes"] == production["scenario_count"],\n                      "active_conflict_only_surface_all_scenarios_pass": role_only["surface_realization_passes"] == role_only["scenario_count"],'
          )
          text = text.replace(
              '                  "| Projection | Core | Conduct | Recoverability | Authority | Active-conflict conduct | No-active-conflict conduct |",\n                  "| --- | ---: | ---: | ---: | ---: | ---: | ---: |",',
              '                  "| Projection | Semantic core | Experience | Conduct | Retrieval | Surface | Authority | Active-conflict conduct | No-active-conflict conduct |",\n                  "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",'
          )
          old = '''                      f"| {item['projection']} | {item['core_passes']}/{item['scenario_count']} | "
                      f"{item['conduct_passes']}/{item['scenario_count']} | "
                      f"{item['recoverability_passes']}/{item['scenario_count']} | "
                      f"{item['authority_passes']}/{item['scenario_count']} | "'''
          new = '''                      f"| {item['projection']} | {item['core_passes']}/{item['scenario_count']} | "
                      f"{item['experience_passes']}/{item['scenario_count']} | "
                      f"{item['conduct_passes']}/{item['scenario_count']} | "
                      f"{item['recoverability_passes']}/{item['scenario_count']} | "
                      f"{item['surface_realization_passes']}/{item['scenario_count']} | "
                      f"{item['authority_passes']}/{item['scenario_count']} | "'''
          if old not in text:
              raise SystemExit('summary row block not found')
          text = text.replace(old, new)
          text = text.replace(
              '                  "| Scenario | Distractors | Projection | Hot USER_TOLD after restart | Conduct | Old context | Recent context | Negative safe | Reopened provenance | Core |",\n                  "| --- | --- | --- | ---: | --- | --- | --- | --- | --- | --- |",',
              '                  "| Scenario | Distractors | Projection | Hot USER_TOLD | Conduct | Old trace | Recent trace | Old surface | Recent surface | Negative safe | Provenance | Semantic | Experience |",\n                  "| --- | --- | --- | ---: | --- | --- | --- | --- | --- | --- | --- | --- | --- |",'
          )
          old = '''                      f"{row['resident_user_told_after_restart']} | {row['conduct_pass']} | "
                      f"{row['old_context_visible']} | {row['recent_context_visible']} | "
                      f"{row['negative_recall_safe']} | {row['reopened_provenance_pass']} | {row['core_pass']} |"'''
          new = '''                      f"{row['resident_user_told_after_restart']} | {row['conduct_pass']} | "
                      f"{row['old_context_trace']} | {row['recent_context_trace']} | "
                      f"{row['old_context_visible']} | {row['recent_context_visible']} | "
                      f"{row['negative_recall_safe']} | {row['reopened_provenance_pass']} | "
                      f"{row['semantic_core_pass']} | {row['experience_pass']} |"'''
          if old not in text:
              raise SystemExit('matrix row block not found')
          text = text.replace(old, new)
          text = text.replace(
              '                  "No global resident-memory count is selected by this experiment.",',
              '                  "Retrieval and surface realization are separate contracts in V2. A surface miss with a correct grounded trace is not silently relabeled as amnesia.",\n                  "",\n                  "No global resident-memory count is selected by this experiment.",'
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/semantic_memory_recoverability_probe.py
      - name: Run refined probe
        run: |
          python tools/semantic_memory_recoverability_probe.py \
            --json persona_engine/evidence/mvi/semantic_memory_recoverability.json \
            --markdown persona_engine/evidence/mvi/SEMANTIC_MEMORY_RECOVERABILITY.md
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Correct durable status from V2 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('persona_engine')
          data = json.loads((root / 'evidence/mvi/semantic_memory_recoverability.json').read_text())
          summary = {item['projection']: item for item in data['summaries']}
          obs = data['observations']
          surface_failures = [
              row for row in data['rows']
              if row['semantic_core_pass'] and not row['surface_realization_pass']
          ]
          failure_lines = []
          for row in surface_failures[:12]:
              failure_lines.append(
                  f"- `{row['scenario']}/{row['distractor_kind']}/{row['projection']}`: "
                  f"old=`{row['old_context_response']}`; recent=`{row['recent_context_response']}`"
              )
          failures = '\n'.join(failure_lines) if failure_lines else '- none'

          section = f'''## 2026-08-30 semantic memory recoverability phase

          **V2 EVIDENCE COMPLETE; production global hot-memory policy remains EXPERIMENTAL.** No universal resident-memory capacity was selected and no production retention behavior changed.

          The first V1 run deliberately remains in git history but its combined recoverability gate was confounded: it required literal renderer inclusion of memory values and used a newer workshop query that had not been part of the established cold-readthrough contract. V2 separates semantic retrieval/authority correctness from experience-level surface realization and restores the demonstrated `What about the workshop door?` continuation query.

          Across six restarted histories, semantic-core passes / 6 are: production `{summary['production']['core_passes']}/6`; recoverable-cold-only `{summary['recoverable_cold_only']['core_passes']}/6`; active-conflict-only `{summary['active_conflict_only']['core_passes']}/6`; recent-context-only `{summary['recent_context_only']['core_passes']}/6`; active-conflict-plus-recent `{summary['active_conflict_plus_recent']['core_passes']}/6`.

          Conduct passes / 6 are: production `{summary['production']['conduct_passes']}/6`; recoverable-cold-only `{summary['recoverable_cold_only']['conduct_passes']}/6`; active-conflict-only `{summary['active_conflict_only']['conduct_passes']}/6`; recent-context-only `{summary['recent_context_only']['conduct_passes']}/6`; active-conflict-plus-recent `{summary['active_conflict_plus_recent']['conduct_passes']}/6`.

          Grounded retrieval-contract passes / 6 are: production `{summary['production']['recoverability_passes']}/6`; recoverable-cold-only `{summary['recoverable_cold_only']['recoverability_passes']}/6`; active-conflict-only `{summary['active_conflict_only']['recoverability_passes']}/6`; recent-context-only `{summary['recent_context_only']['recoverability_passes']}/6`; active-conflict-plus-recent `{summary['active_conflict_plus_recent']['recoverability_passes']}/6`.

          Surface-realization passes / 6 are: production `{summary['production']['surface_realization_passes']}/6`; recoverable-cold-only `{summary['recoverable_cold_only']['surface_realization_passes']}/6`; active-conflict-only `{summary['active_conflict_only']['surface_realization_passes']}/6`; recent-context-only `{summary['recent_context_only']['surface_realization_passes']}/6`; active-conflict-plus-recent `{summary['active_conflict_plus_recent']['surface_realization_passes']}/6`.

          The conduct discriminator is strong: active-conflict-only preserves current conflict-sensitive conduct while cold-only and recent-only do not when unresolved relationship history is active. Reopened-conflict reflection provenance remains scoped to the current post-repair conflict episode where reflection is present. Commitment and identity authority remain independent of these projections.

          Retrieval and renderer realization must not be conflated. Any row with a correct grounded trace but missing literal value is retained below as a surface diagnostic rather than reported as memory loss:

          {failures}

          Evidence: `persona_engine/evidence/mvi/SEMANTIC_MEMORY_RECOVERABILITY.md` and `semantic_memory_recoverability.json`.

          **Next action:** if production V2 semantic core is green but production surface is not, isolate the minimum renderer realization defect without changing memory retention. If semantic core itself fails in production, diagnose that causal path first. Do not select a global hot-memory `N` from this evidence.
          '''
          section = '\n'.join(line.strip() for line in section.splitlines()).strip() + '\n\n'

          progress_path = root / 'docs/WAYFARER_PROGRESS.md'
          progress = progress_path.read_text()
          marker = '## 2026-08-30 semantic memory recoverability phase'
          if marker in progress:
              progress = progress.split(marker, 1)[0].rstrip() + '\n\n' + section
          else:
              progress = progress.rstrip() + '\n\n' + section
          progress_path.write_text(progress, encoding='utf-8')

          status_path = root / 'docs/CURRENT_STATUS.md'
          status = status_path.read_text()
          status_marker = '## Semantic memory recoverability status'
          status_section = section.replace(marker, status_marker)
          if status_marker in status:
              before, rest = status.split(status_marker, 1)
              next_heading = rest.find('\n## ')
              if next_heading >= 0:
                  rest = rest[next_heading + 1:]
                  status = before.rstrip() + '\n\n' + status_section + rest
              else:
                  status = before.rstrip() + '\n\n' + status_section
          else:
              status = status.rstrip() + '\n\n' + status_section
          status_path.write_text(status, encoding='utf-8')
          PY
      - name: Commit refined phase evidence
        run: |
          rm -f .github/workflows/wayfarer-memory-role-refine.yml
          git config user.name 'Wayfarer Evidence'
          git config user.email 'wayfarer-evidence@users.noreply.github.com'
          git add -A
          git commit -m 'Refine semantic memory recoverability evidence'
          git push origin HEAD:wayfarer
