name: Wayfarer subject-wide canonical ordering probe

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify current ownership regression
        run: python -m pytest persona_engine/tests/test_interlocutor_subject_state.py -q
      - name: Run subject-wide ordering probe
        run: |
          python tools/subject_history_order_probe.py \
            --json persona_engine/evidence/mvi/subject_history_ordering.json \
            --markdown persona_engine/evidence/mvi/SUBJECT_HISTORY_ORDERING.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-subject-order-probe.yml
          git config user.name 'Wayfarer Subject Order Probe'
          git config user.email 'wayfarer-order@users.noreply.github.com'
          git add -A
          git commit -m 'Capture subject-wide canonical ordering evidence'
          git push origin HEAD:wayfarer
