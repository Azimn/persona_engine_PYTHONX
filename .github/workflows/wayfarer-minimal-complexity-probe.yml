name: Wayfarer minimal perceived-complexity probe

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify current ownership contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_subject_state_scope.py \
            persona_engine/tests/test_interlocutor_subject_state.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_commitment_constraint.py \
            persona_engine/tests/test_subject_sequence.py -q
      - name: Run minimal perceived-complexity probe
        run: |
          python tools/minimal_perceived_complexity_probe.py \
            --json persona_engine/evidence/mvi/minimal_perceived_complexity.json \
            --markdown persona_engine/evidence/mvi/MINIMAL_PERCEIVED_COMPLEXITY.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-minimal-complexity-probe.yml
          git config user.name 'Wayfarer Minimal Complexity Probe'
          git config user.email 'wayfarer-minimal-complexity@users.noreply.github.com'
          git add -A
          git commit -m 'Capture minimal combinatorial continuity evidence'
          git push origin HEAD:wayfarer
