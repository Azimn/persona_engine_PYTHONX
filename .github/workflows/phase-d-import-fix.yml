name: Phase D Import Fix

on:
  push:
    branches: [wayfarer-real-model-collection-phase]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Make sibling tool import robust
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/local_eval.py')
          text = path.read_text(encoding='utf-8')
          old = '''try:\n    from tools.renderer_degradation_real import run_ollama as run_degradation_ollama\nexcept ModuleNotFoundError:\n    # Direct script execution places the tools directory, rather than the\n    # repository root, on the leading import path.\n    from renderer_degradation_real import run_ollama as run_degradation_ollama\n'''
          new = '''try:\n    from tools.renderer_degradation_real import run_ollama as run_degradation_ollama\nexcept ModuleNotFoundError:\n    # Sibling evaluation tools historically use direct imports. Make that\n    # execution layout available when this CLI is imported as tools.local_eval.\n    tools_dir = str(Path(__file__).resolve().parent)\n    if tools_dir not in sys.path:\n        sys.path.insert(0, tools_dir)\n    from renderer_degradation_real import run_ollama as run_degradation_ollama\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one local-eval import block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify focused provenance path
        run: python -m pytest persona_engine/tests/test_local_model_session.py -q
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/phase-d-import-fix.yml
      - name: Commit import fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/local_eval.py .github/workflows/phase-d-import-fix.yml
          git diff --cached --check
          git commit -m "Make local evaluation importable for verification"
          git push origin HEAD:wayfarer-real-model-collection-phase
