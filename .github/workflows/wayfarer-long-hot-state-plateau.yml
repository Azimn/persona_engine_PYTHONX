name: Wayfarer long hot-state plateau

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify bounded-memory contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_memory_first_person_contract.py \
            persona_engine/tests/test_cold_biography.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_commitment_constraint.py -q
      - name: Run 5000-turn hot-state plateau probe
        run: |
          python tools/long_hot_state_plateau_probe.py \
            --json persona_engine/evidence/mvi/long_hot_state_plateau.json \
            --markdown persona_engine/evidence/mvi/LONG_HOT_STATE_PLATEAU.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-long-hot-state-plateau.yml
          git config user.name 'Wayfarer Long Hot-State Plateau Probe'
          git config user.email 'wayfarer-hot-state-plateau@users.noreply.github.com'
          git add -A
          git commit -m 'Measure long-horizon bounded active state'
          git push origin HEAD:wayfarer
