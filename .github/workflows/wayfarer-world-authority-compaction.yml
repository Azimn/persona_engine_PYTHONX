name: Wayfarer WorldAuthority semantic compaction

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify world authority contracts
        run: |
          python -m pytest persona_engine/tests/test_v10_world_sensory.py -q
      - name: Run semantic compaction probe
        run: |
          python tools/world_authority_semantic_compaction_probe.py \
            --json persona_engine/evidence/mvi/world_authority_semantic_compaction.json \
            --markdown persona_engine/evidence/mvi/WORLD_AUTHORITY_SEMANTIC_COMPACTION.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-world-authority-compaction.yml
          git config user.name 'Wayfarer WorldAuthority Compaction Probe'
          git config user.email 'wayfarer-world-compaction@users.noreply.github.com'
          git add -A
          git commit -m 'Test semantics-preserving WorldAuthority compaction'
          git push origin HEAD:wayfarer
