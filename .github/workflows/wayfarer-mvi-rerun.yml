name: Wayfarer MVI rerun after sensorium transition fix

on:
  push:
    branches: [wayfarer]
    paths:
      - '.github/workflows/wayfarer-mvi-rerun.yml'

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify transition semantics and MVI harness
        run: |
          python -m pytest persona_engine/tests/test_sensorium_transition_events.py persona_engine/tests/test_mvi_character_baseline.py -q
      - name: Regenerate fixed Study-A baseline
        run: |
          python tools/mvi_character_baseline.py \
            --json persona_engine/evidence/mvi/early_character_baseline.json \
            --markdown persona_engine/evidence/mvi/EARLY_CHARACTER_BASELINE.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-mvi-rerun.yml
          git config user.name 'Wayfarer MVI Study'
          git config user.email 'wayfarer-mvi@users.noreply.github.com'
          git add -A
          git commit -m 'Regenerate MVI baseline after transition semantics fix'
          git push origin HEAD:wayfarer
