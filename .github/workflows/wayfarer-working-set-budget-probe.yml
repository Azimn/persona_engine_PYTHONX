name: Wayfarer active working-set budget probe

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify current continuity behavior
        run: |
          python -m pytest \
            persona_engine/tests/test_subject_state_scope.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_commitment_constraint.py \
            persona_engine/tests/test_subject_sequence.py -q
      - name: Run active working-set budget probe
        run: |
          python tools/active_working_set_budget_probe.py \
            --json persona_engine/evidence/mvi/active_working_set_budget.json \
            --markdown persona_engine/evidence/mvi/ACTIVE_WORKING_SET_BUDGET.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-working-set-budget-probe.yml
          git config user.name 'Wayfarer Working Set Probe'
          git config user.email 'wayfarer-working-set@users.noreply.github.com'
          git add -A
          git commit -m 'Measure behavior-preserving active working-set budgets'
          git push origin HEAD:wayfarer
