name: Wayfarer grounded cold biography recall

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run focused grounding tests
        run: |
          python -m pytest \
            persona_engine/tests/test_cold_biography.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_commitment_constraint.py -q
      - name: Verify positive cold recall still works
        run: |
          python tools/cold_biography_readthrough_probe.py \
            --json persona_engine/evidence/mvi/cold_biography_readthrough.json \
            --markdown persona_engine/evidence/mvi/COLD_BIOGRAPHY_READTHROUGH.md
      - name: Verify nonexistent recall fails closed
        run: |
          python tools/cold_biography_false_recall_probe.py \
            --json persona_engine/evidence/mvi/cold_biography_false_recall.json \
            --markdown persona_engine/evidence/mvi/COLD_BIOGRAPHY_FALSE_RECALL.md
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('persona_engine/evidence/mvi/cold_biography_false_recall.json').read_text())
          assert result['requested_detail_absent_from_canonical_history'] is True
          assert result['cold_candidate_count'] == 0
          assert result['renderer_asserted_memory'] is False
          assert result['false_recall_demonstrated'] is False
          PY
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Commit corrected evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-cold-biography-grounding.yml
          git config user.name 'Wayfarer Grounded Recall Validation'
          git config user.email 'wayfarer-grounded-recall@users.noreply.github.com'
          git add -A
          git commit -m 'Validate fail-closed autobiographical recall'
          git push origin HEAD:wayfarer
