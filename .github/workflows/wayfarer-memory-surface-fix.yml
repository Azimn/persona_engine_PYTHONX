name: Wayfarer memory surface continuity repair

on:
  push:
    branches: [wayfarer]
    paths:
      - '.github/workflows/wayfarer-memory-surface-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Repair bounded memory realization
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('persona_engine/core/offline_template_renderer.py')
          text = source.read_text()
          marker = 'Memory-command scaffolding is not part of the remembered fact.'
          if marker not in text:
              needle = '        memory = re.sub(r"^I heard you say:\\s*", "you said ", memory, flags=re.IGNORECASE)\n'
              if needle not in text:
                  raise SystemExit('single memory normalization line not found')
              addition = textwrap.dedent('''\
                      # Memory-command scaffolding is not part of the remembered fact. Under
                      # a tight expression budget it can consume the slot and hide the value
                      # retrieval actually recovered. Strip only generic recall instructions;
                      # selection, authority, canonical storage, and retention stay unchanged.
                      memory = re.sub(
                          r"^you said\\s+(?:please\\s+)?remember\\s+(?:this\\s+)?(?:neutral\\s+)?(?:detail|fact)\\s*:\\s*",
                          "",
                          memory,
                          flags=re.IGNORECASE,
                      )
              ''')
              # dedent produces top-level text, but this code belongs inside the method.
              addition = ''.join(('        ' + line if line.strip() else line) for line in addition.splitlines(keepends=True))
              text = text.replace(needle, needle + addition, 1)
              source.write_text(text, encoding='utf-8')

          tests = Path('persona_engine/tests/test_offline_template_renderer.py')
          test_text = tests.read_text()
          if 'def test_tight_memory_budget_preserves_recalled_value():' not in test_text:
              test_text += '\n\n' + textwrap.dedent('''\
                  def test_tight_memory_budget_preserves_recalled_value():
                      load_cartridge(str(ROOT / "cartridges" / "pretorius.snp"))
                      renderer = OfflineTemplateRenderer()
                      memory = MemoryUnit(
                          content="I heard you say: Please remember this neutral detail: the old observatory code word is amber-otter.",
                          created_at=1.0,
                          source=KnowledgeSource.USER_TOLD,
                          tags={"canonical_user_statement", "cold_biography", "contextual_readthrough"},
                      )
                      request = SimpleNamespace(
                          ledger_digest={"identity": "Pretorius"},
                          resolved_state={
                              "system_prompt": "Character identity: Pretorius",
                              "user_text": "Is the old observatory code word still the same?",
                          },
                          decision_payload={"dialogue_act": "respond"},
                          retrieved_memories=[memory],
                          evidence=[],
                          seed=17,
                      )

                      response = renderer.render_expression_request(request, max_chars=100).lower()

                      assert len(response) <= 100
                      assert "amber-otter" in response
                      assert "please remember this neutral detail" not in response
              ''')
              tests.write_text(test_text, encoding='utf-8')
          PY
          python -m py_compile persona_engine/core/offline_template_renderer.py persona_engine/tests/test_offline_template_renderer.py
      - name: Run targeted renderer regression
        run: python -m pytest persona_engine/tests/test_offline_template_renderer.py -q
      - name: Re-run semantic recoverability evidence
        run: |
          python tools/semantic_memory_recoverability_probe.py --json persona_engine/evidence/mvi/semantic_memory_recoverability.json --markdown persona_engine/evidence/mvi/SEMANTIC_MEMORY_RECOVERABILITY.md
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('persona_engine/evidence/mvi/semantic_memory_recoverability.json').read_text())
          summary = {row['projection']: row for row in data['summaries']}
          production = summary['production']
          assert production['semantic_core_passes'] == production['scenario_count'], production
          assert production['experience_passes'] == production['scenario_count'], production
          assert production['retrieval_contract_passes'] == production['scenario_count'], production
          assert production['surface_realization_passes'] == production['scenario_count'], production
          assert production['authority_passes'] == production['scenario_count'], production
          role = summary['active_conflict_only']
          assert role['active_conflict_conduct_passes'] == role['active_conflict_scenarios'], role
          assert summary['recoverable_cold_only']['active_conflict_conduct_passes'] == 0
          assert summary['recent_context_only']['active_conflict_conduct_passes'] == 0
          PY
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Commit tested phase repair
        run: |
          rm -f .github/workflows/wayfarer-memory-surface-fix.yml
          git config user.name 'Wayfarer Evidence'
          git config user.email 'wayfarer-evidence@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve recovered memory values under tight output budgets'
          git push origin HEAD:wayfarer
