name: C2 Relationship Verification

on:
  push:
    branches: [wayfarer-relationship-dispositions-phase]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run deterministic test suite
        run: python -m pytest persona_engine/tests -q
      - name: Run relationship convergence probe
        run: python -m persona_engine.evaluation.relationship_convergence

  sync:
    if: github.actor != 'github-actions[bot]'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize durable documentation
        run: python tools/c2_doc_sync.py
      - name: Remove temporary C2 tooling
        run: |
          rm -f tools/c2_doc_sync.py
          rm -f .github/workflows/c2-documentation-sync.yml
          rm -f .github/workflows/c2-relationship-verification.yml
      - name: Commit verified C2 documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WAYFARER_CHARACTER_CONTROL_PLAN.md persona_engine/docs/CURRENT_STATUS.md persona_engine/docs/WAYFARER_PROGRESS.md tools .github/workflows
          git diff --cached --check
          git commit -m "Synchronize verified C2 project status"
          git push origin HEAD:wayfarer-relationship-dispositions-phase
