name: Wayfarer developmental continuity closeout

on:
  push:
    branches: [wayfarer]
    paths:
      - 'WAYFARER_DEVELOPMENTAL_CLOSEOUT_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Update code hygiene and durable docs
        run: |
          python tools/_close_developmental_continuity_phase.py
          python -m compileall -q persona_engine tools
          grep -q '268739c' persona_engine/docs/WAYFARER_PROGRESS.md
          grep -q 'Developmental continuity contract' persona_engine/docs/CURRENT_STATUS.md
          grep -q 'belief_consolidation' persona_engine/docs/WAYFARER_MASTER_PLAN.md
      - name: Re-run developmental contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_developmental_continuity.py \
            persona_engine/tests/test_continuity_replay.py \
            persona_engine/tests/test_root_only_continuity.py -q
      - name: Commit docs and clean one-time scaffolding
        run: |
          rm -f tools/_close_developmental_continuity_phase.py
          rm -f .github/workflows/wayfarer-developmental-closeout.yml
          rm -f WAYFARER_DEVELOPMENTAL_CLOSEOUT_TRIGGER.txt
          git config user.name 'Wayfarer Documentation'
          git config user.email 'wayfarer-docs@users.noreply.github.com'
          git add -A
          git commit -m 'Document developmental continuity contract'
          git push origin HEAD:wayfarer
