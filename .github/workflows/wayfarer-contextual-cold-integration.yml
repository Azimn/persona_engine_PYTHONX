name: Wayfarer contextual cold integration

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply validated contextual patch
        run: python tools/_integrate_contextual_cold_biography.py
      - name: Run focused contextual and renderer tests
        run: |
          python -m pytest \
            persona_engine/tests/test_cold_biography.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_offline_template_renderer.py -q
      - name: Run full deterministic suite
        run: python -m pytest -q
      - name: Commit integrated production seam
        run: |
          rm -f tools/_integrate_contextual_cold_biography.py
          rm -f .github/workflows/wayfarer-contextual-cold-integration.yml
          git config user.name 'Wayfarer Contextual Cold Integration'
          git config user.email 'wayfarer-contextual-integration@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate grounded contextual cold biography'
          git push origin HEAD:wayfarer
