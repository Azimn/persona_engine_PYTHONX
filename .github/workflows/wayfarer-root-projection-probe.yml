name: Wayfarer canonical root projection probe

on:
  push:
    branches: [wayfarer]
    paths:
      - 'WAYFARER_ROOT_PROJECTION_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify replay and biography contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_continuity_replay.py \
            persona_engine/tests/test_cold_biography.py \
            persona_engine/tests/test_continuity_ledger.py \
            persona_engine/tests/test_history_decision_evidence.py -q
      - name: Run root-only continuity projection
        run: |
          python tools/canonical_root_projection_probe.py \
            --json persona_engine/evidence/mvi/canonical_root_projection.json \
            --markdown persona_engine/evidence/mvi/CANONICAL_ROOT_PROJECTION.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-root-projection-probe.yml
          rm -f WAYFARER_ROOT_PROJECTION_TRIGGER.txt
          git config user.name 'Wayfarer Root Projection'
          git config user.email 'wayfarer-root-projection@users.noreply.github.com'
          git add -A
          git commit -m 'Measure canonical root-only continuity projection'
          git push origin HEAD:wayfarer
