name: Wayfarer developmental continuity integration

on:
  push:
    branches: [wayfarer]
    paths:
      - 'WAYFARER_DEVELOPMENTAL_CONTINUITY_INTEGRATION_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply developmental continuity contract
        run: |
          python tools/_integrate_developmental_continuity.py
          python tools/_fix_developmental_probe_generation.py
          python -m compileall -q persona_engine tools
      - name: Run focused developmental continuity contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_developmental_continuity.py \
            persona_engine/tests/test_dream_engine.py \
            persona_engine/tests/test_belief_ledger.py \
            persona_engine/tests/test_continuity_replay.py \
            persona_engine/tests/test_root_only_continuity.py -q
      - name: Run full deterministic suite
        run: python -m pytest -q
      - name: Capture post-fix developmental evidence
        run: |
          python tools/developmental_continuity_probe.py \
            --json persona_engine/evidence/mvi/developmental_continuity_fixed.json \
            --markdown persona_engine/evidence/mvi/DEVELOPMENTAL_CONTINUITY_FIXED.md
      - name: Commit runtime contract and evidence
        run: |
          rm -f tools/_integrate_developmental_continuity.py
          rm -f tools/_fix_developmental_probe_generation.py
          rm -f .github/workflows/wayfarer-developmental-continuity-integration.yml
          rm -f WAYFARER_DEVELOPMENTAL_CONTINUITY_INTEGRATION_TRIGGER.txt
          git config user.name 'Wayfarer Developmental Continuity'
          git config user.email 'wayfarer-developmental-continuity@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve slow belief development in canonical continuity'
          git push origin HEAD:wayfarer
