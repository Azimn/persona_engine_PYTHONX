name: Wayfarer bounded rehearsal trace

on:
  push:
    branches: [wayfarer]
    paths:
      - 'WAYFARER_BOUNDED_REHEARSAL_TRIGGER.txt'
      - '.github/workflows/wayfarer-bounded-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply bounded rehearsal patch
        run: python tools/_integrate_bounded_rehearsal_trace.py
      - name: Run focused memory and experience tests
        run: |
          python -m pytest \
            persona_engine/tests/test_bounded_rehearsal_trace.py \
            persona_engine/tests/test_role_bounded_user_memory.py \
            persona_engine/tests/test_memory_experience_guards.py \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_cold_biography.py -q
      - name: Run full deterministic suite
        run: python -m pytest -q
      - name: Commit bounded rehearsal repair
        run: |
          rm -f tools/_integrate_bounded_rehearsal_trace.py
          rm -f .github/workflows/wayfarer-bounded-rehearsal.yml
          rm -f WAYFARER_BOUNDED_REHEARSAL_TRIGGER.txt
          git config user.name 'Wayfarer Bounded Rehearsal'
          git config user.email 'wayfarer-bounded-rehearsal@users.noreply.github.com'
          git add -A
          git commit -m 'Bound autobiographical rehearsal traces'
          git push origin HEAD:wayfarer
