name: Wayfarer subject-owned clock restoration

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply subject clock restoration
        run: python tools/apply_subject_clock_restore.py
      - name: Run focused clock and continuity tests
        run: |
          python -m pytest \
            persona_engine/tests/test_continuity_clock.py \
            persona_engine/tests/test_subject_sequence.py \
            persona_engine/tests/test_interlocutor_subject_state.py \
            persona_engine/tests/test_continuity_replay.py -q
      - name: Regenerate subject clock evidence
        run: |
          python tools/subject_clock_ownership_probe.py \
            --json persona_engine/evidence/mvi/subject_clock_ownership.json \
            --markdown persona_engine/evidence/mvi/SUBJECT_CLOCK_OWNERSHIP.md
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Commit integrated repair and evidence
        run: |
          rm -f tools/apply_subject_clock_restore.py .github/workflows/wayfarer-subject-clock-restore.yml
          git config user.name 'Wayfarer Subject Clock Integration'
          git config user.email 'wayfarer-subject-clock@users.noreply.github.com'
          git add -A
          git commit -m 'Keep one subject on one timeline across interlocutors'
          git push origin HEAD:wayfarer
