name: Wayfarer developmental continuity probe

on:
  push:
    branches: [wayfarer]
    paths:
      - 'WAYFARER_DEVELOPMENTAL_CONTINUITY_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run developmental continuity experiment
        run: |
          python tools/developmental_continuity_probe.py \
            --json persona_engine/evidence/mvi/developmental_continuity.json \
            --markdown persona_engine/evidence/mvi/DEVELOPMENTAL_CONTINUITY.md
      - name: Re-run slow-belief unit contracts
        run: |
          python -m pytest persona_engine/tests/test_dream_engine.py persona_engine/tests/test_belief_ledger.py -q
      - name: Commit experiment evidence and clean one-time scaffolding
        run: |
          rm -f .github/workflows/wayfarer-developmental-continuity-probe.yml
          rm -f WAYFARER_DEVELOPMENTAL_CONTINUITY_TRIGGER.txt
          git config user.name 'Wayfarer Developmental Continuity'
          git config user.email 'wayfarer-developmental-continuity@users.noreply.github.com'
          git add -A
          git commit -m 'Capture developmental continuity boundary experiment'
          git push origin HEAD:wayfarer
