name: Wayfarer cold biography amnesia probe

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify current memory and continuity contracts
        run: |
          python -m pytest \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_subject_sequence.py \
            persona_engine/tests/test_subject_state_scope.py -q
      - name: Run cold biography amnesia probe
        run: |
          python tools/cold_biography_amnesia_probe.py \
            --json persona_engine/evidence/mvi/cold_biography_amnesia.json \
            --markdown persona_engine/evidence/mvi/COLD_BIOGRAPHY_AMNESIA.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-cold-biography-amnesia.yml
          git config user.name 'Wayfarer Cold Biography Probe'
          git config user.email 'wayfarer-cold-biography@users.noreply.github.com'
          git add -A
          git commit -m 'Capture cold-biography recall gap'
          git push origin HEAD:wayfarer
