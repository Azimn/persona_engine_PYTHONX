name: Adjacent Research Prototype

on:
  push:
    branches: [wayfarer-adjacent-research-phase]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify adjacent prototypes
        run: python -m pytest persona_engine/tests/test_epistemic_ledger.py persona_engine/tests/test_delivery_receipt.py persona_engine/tests/test_causal_retrieval.py -q
      - name: Run appraisal subjectivity baseline
        shell: bash
        run: |
          python -m persona_engine.evaluation.appraisal_subjectivity > appraisal-subjectivity-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('appraisal-subjectivity-baseline.json').read_text())
          assert data['case_count'] == 3
          assert data['unique_appraisal_count'] == 1
          assert data['all_appraisals_identical'] is True
          assert data['subject_context_is_input'] is False
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
      - name: Verify deterministic suite
        run: python -m pytest persona_engine/tests -q
