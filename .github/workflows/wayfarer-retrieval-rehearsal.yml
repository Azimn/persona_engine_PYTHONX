name: Wayfarer retrieval rehearsal diagnostic

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify current memory behavior
        run: python -m pytest persona_engine/tests/test_memory_first_person_contract.py -q
      - name: Run retrieval rehearsal diagnostic
        run: |
          python tools/retrieval_rehearsal_probe.py \
            --json persona_engine/evidence/mvi/retrieval_rehearsal.json \
            --markdown persona_engine/evidence/mvi/RETRIEVAL_REHEARSAL.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-retrieval-rehearsal.yml
          git config user.name 'Wayfarer Retrieval Rehearsal Probe'
          git config user.email 'wayfarer-retrieval-rehearsal@users.noreply.github.com'
          git add -A
          git commit -m 'Measure retrieval rehearsal bookkeeping'
          git push origin HEAD:wayfarer
