name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pytest persona_engine/tests -q
      - name: Simulator matrix
        run: |
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/pretorius_basic.yaml --cartridge persona_engine/cartridges/pretorius.snp
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/interpretation_basic.yaml --cartridge persona_engine/cartridges/pretorius.snp
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/organism_basic.yaml --cartridge persona_engine/cartridges/pretorius.snp
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/interpretation_anchored_misread.yaml --cartridge persona_engine/cartridges/pretorius.snp
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/synthesis_strain_recovery.yaml --cartridge persona_engine/cartridges/pretorius.snp
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/lived_experience_v02.yaml --cartridge persona_engine/cartridges/pretorius.snp
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/personaconsole_v6_compat.yaml --cartridge persona_engine/cartridges/pretorius_v6.snp
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/self_monitor_strain.yaml --cartridge persona_engine/cartridges/pretorius.snp
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/self_monitor_correction.yaml --cartridge persona_engine/cartridges/kiki.snp
          python persona_engine/simulator.py --script persona_engine/simulator_scripts/autobiographical_reconsolidation_weeks.yaml --cartridge persona_engine/cartridges/pretorius.snp
      - name: Developmental playtests
        run: |
          python -m persona_engine.playtest --scenario persona_engine/playtest_scenarios/steady_collaborator_30_days.yaml --actor-mode scripted --judge deterministic --output-dir /tmp/steady
          python -m persona_engine.playtest --scenario persona_engine/playtest_scenarios/kiki_tests_pretorius_30_days.yaml --actor-mode character --judge deterministic --output-dir /tmp/kiki-tests
          python -m persona_engine.playtest --scenario persona_engine/playtest_scenarios/pretorius_tests_kiki_30_days.yaml --actor-mode character --judge deterministic --output-dir /tmp/pretorius-tests
          python -m persona_engine.playtest --scenario persona_engine/playtest_scenarios/kiki_pretorius_crossplay_30_days.yaml --actor-mode character --judge deterministic --output-dir /tmp/crossplay
      - name: Pretorius genesis replay
        run: |
          python -m persona_engine.genesis --cartridge persona_engine/cartridges/pretorius.snp --db /tmp/pretorius-genesis.db --end-time 1800000000 --compare-fresh --output /tmp/genesis-comparison.json
