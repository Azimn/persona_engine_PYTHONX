name: Wayfarer commitment longitudinal gap probe

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run commitment gap probe
        run: |
          python tools/commitment_gap_probe.py \
            --json persona_engine/evidence/mvi/commitment_gap.json \
            --markdown persona_engine/evidence/mvi/COMMITMENT_GAP.md
      - name: Commit evidence and remove one-time workflow
        run: |
          rm -f .github/workflows/wayfarer-commitment-gap.yml
          git config user.name 'Wayfarer Commitment Probe'
          git config user.email 'wayfarer-commitment@users.noreply.github.com'
          git add -A
          git commit -m 'Capture commitment longitudinal gap evidence'
          git push origin HEAD:wayfarer
