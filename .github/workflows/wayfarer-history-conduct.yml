name: Wayfarer history-dependent conduct integration

on:
  push:
    branches: [wayfarer]
    paths:
      - '.github/workflows/wayfarer-history-conduct.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply history conduct integration
        run: python tools/apply_history_decision_evidence.py
      - name: Run focused history and MVI tests
        run: |
          python -m pytest \
            persona_engine/tests/test_history_decision_evidence.py \
            persona_engine/tests/test_mvi_character_baseline.py \
            persona_engine/tests/test_sensorium_transition_events.py -q
      - name: Run fixed history conduct probe
        run: python tools/history_conduct_probe.py
      - name: Confirm original early MVI scenario remains stable
        run: |
          python tools/mvi_character_baseline.py \
            --json persona_engine/evidence/mvi/early_character_baseline.json \
            --markdown persona_engine/evidence/mvi/EARLY_CHARACTER_BASELINE.md
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Commit integrated mechanism and evidence
        run: |
          rm -f tools/apply_history_decision_evidence.py .github/workflows/wayfarer-history-conduct.yml
          git config user.name 'Wayfarer History Integration'
          git config user.email 'wayfarer-history@users.noreply.github.com'
          git add -A
          git commit -m 'Let relevant lived history qualify present conduct'
          git push origin HEAD:wayfarer
