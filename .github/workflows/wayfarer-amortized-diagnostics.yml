name: Wayfarer amortized diagnostic pruning

on:
  push:
    branches: [wayfarer]
    paths:
      - 'WAYFARER_AMORTIZED_DIAGNOSTICS_TRIGGER.txt'
      - '.github/workflows/wayfarer-amortized-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply amortized pruning patch
        run: python tools/_amortize_diagnostic_pruning.py
      - name: Run focused persistence tests
        run: |
          python -m pytest \
            persona_engine/tests/test_bounded_diagnostic_persistence.py \
            persona_engine/tests/test_dream_engine.py \
            persona_engine/tests/test_continuity_ledger.py -q
      - name: Run full deterministic suite
        run: python -m pytest -q
      - name: Re-measure 1000-turn storage and runtime
        run: |
          python tools/persistence_storage_probe.py --turns 1000 \
            --json persona_engine/evidence/mvi/persistence_storage_probe.json \
            --markdown persona_engine/evidence/mvi/PERSISTENCE_STORAGE_PROBE.md
      - name: Commit amortized maintenance and evidence
        run: |
          rm -f tools/_amortize_diagnostic_pruning.py
          rm -f .github/workflows/wayfarer-amortized-diagnostics.yml
          rm -f WAYFARER_AMORTIZED_DIAGNOSTICS_TRIGGER.txt
          git config user.name 'Wayfarer Amortized Diagnostics'
          git config user.email 'wayfarer-amortized-diagnostics@users.noreply.github.com'
          git add -A
          git commit -m 'Amortize bounded diagnostic maintenance'
          git push origin HEAD:wayfarer
