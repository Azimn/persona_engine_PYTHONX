name: Wayfarer consistency integration

on:
  push:
    branches: [wayfarer]
    paths:
      - '.wayfarer/consistency_integration.trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply consistency integration patch
        run: |
          python persona_engine/tools/_wayfarer_consistency_integration_patch.py
          python persona_engine/tools/_wayfarer_consistency_test_patch.py
      - name: Run phase-targeted tests
        run: |
          python -m pytest \
            persona_engine/tests/test_consistency_contract.py \
            persona_engine/tests/test_consistency_engine_policy.py \
            persona_engine/tests/test_renderer_swap_contract.py \
            persona_engine/tests/test_long_silence_contract.py \
            persona_engine/tests/test_engine.py -q
      - name: Commit integrated runtime changes and remove one-time scaffolding
        run: |
          git config user.name 'Wayfarer Integration'
          git config user.email 'wayfarer-integration@users.noreply.github.com'
          git rm .wayfarer/consistency_integration.trigger
          git rm .github/workflows/wayfarer-consistency-integration.yml
          git rm persona_engine/tools/_wayfarer_consistency_integration_patch.py
          git rm persona_engine/tools/_wayfarer_consistency_test_patch.py
          git add persona_engine/core/engine.py persona_engine/core/offline_template_renderer.py persona_engine/tests/test_engine.py
          git commit -m 'Integrate consistency severity and renderer-independent decision effects'
          git push origin HEAD:wayfarer
