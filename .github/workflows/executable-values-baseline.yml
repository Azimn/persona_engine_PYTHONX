name: Executable Values Baseline

on:
  push:
    branches: [wayfarer-executable-values-phase]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Run value-boundary probe
        run: python -m persona_engine.evaluation.value_boundary_probe
