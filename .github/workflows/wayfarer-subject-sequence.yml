name: Wayfarer subject-wide canonical ordinal

on:
  push:
    branches: [wayfarer]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wayfarer
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Apply subject-wide ordinal repair
        run: python tools/apply_subject_sequence.py
      - name: Run focused continuity tests
        run: |
          python -m pytest \
            persona_engine/tests/test_subject_sequence.py \
            persona_engine/tests/test_continuity_ledger.py \
            persona_engine/tests/test_continuity_replay.py \
            persona_engine/tests/test_interlocutor_subject_state.py -q
      - name: Regenerate subject-order evidence
        run: |
          python tools/subject_history_order_probe.py \
            --json persona_engine/evidence/mvi/subject_history_ordering.json \
            --markdown persona_engine/evidence/mvi/SUBJECT_HISTORY_ORDERING.md
      - name: Run full deterministic suite
        run: python -m pytest persona_engine/tests -q
      - name: Commit integrated repair and evidence
        run: |
          rm -f tools/apply_subject_sequence.py .github/workflows/wayfarer-subject-sequence.yml
          git config user.name 'Wayfarer Subject Sequence Integration'
          git config user.email 'wayfarer-subject-sequence@users.noreply.github.com'
          git add -A
          git commit -m 'Give one subject one canonical biography order'
          git push origin HEAD:wayfarer
