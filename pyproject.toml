[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-engine"
version = "12.0.0"
description = "Deterministic character-organism engine with cartridge-driven identity and a mock-safe human testing UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
test = [
  "pytest>=8.0",
  "fastapi>=0.110",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]
ollama = [
  "ollama>=0.3.0",
]

[project.scripts]
persona-engine-sim = "persona_engine.simulator:main"
persona-engine-ui = "persona_engine.cli:run_ui"

[tool.setuptools.packages.find]
include = ["persona_engine*"]

[tool.setuptools.package-data]
persona_engine = [
  "cartridges/*.snp",
  "docs/*.md",
  "simulator_scripts/*.yaml",
  "source_profile_notes/*.md",
  "tests/*.py",
  "ui_static/*",
]
